packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

# Installation must fail when a dependency introduces an unreviewed lifecycle script.
strictDepBuilds: true
dangerouslyAllowAllBuilds: false

# Keep transitive dependencies on registry/workspace sources and re-apply pnpm's
# supply-chain checks even when a frozen lockfile is present.
blockExoticSubdeps: true
trustLockfile: false

# UniApp's pinned compiler currently carries older compatible transitive ranges.
# Force reviewed patched releases until the frozen compiler train includes them.
overrides:
  '@intlify/core-base': 9.1.11
  '@intlify/message-resolver': 9.1.11
  adm-zip: 0.6.0
  jpeg-js: 0.4.4
  postcss: 8.5.26
  ws: 8.21.0

allowBuilds:
  # Reviewed non-essential funding hooks are explicitly denied.
  core-js: false
  core-js-pure: false
  esbuild: true
