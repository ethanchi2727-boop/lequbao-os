name: V6.1 quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: v6-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lequ_v6
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lequ_v6"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: lequ_v6
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply clean schema
        run: psql -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Prove tenant RLS isolation
        run: psql -v ON_ERROR_STOP=1 -f database/tests/rls.sql
      - name: Prove revenue-right and 70/10/20 constraints
        run: psql -v ON_ERROR_STOP=1 -f database/tests/revenue-rights.sql
      - name: Prove exact distribution reconciliation and immutable ledger
        run: psql -v ON_ERROR_STOP=1 -f database/tests/revenue-distribution.sql
      - name: Prove immutable subscription receipt and refund source ledger
        run: psql -v ON_ERROR_STOP=1 -f database/tests/subscription-cash-ledger.sql
      - name: Prove incremental migrations from the 73-table package baseline
        run: |
          createdb lequ_v6_migration
          psql -d lequ_v6_migration -v ON_ERROR_STOP=1 -f docs/v6.1/source-package/05_数据API事件权限与安全/database/schema.sql
          psql -d lequ_v6_migration -v ON_ERROR_STOP=1 -f database/migrations/0003_revenue_distribution_invariants.sql
          psql -d lequ_v6_migration -v ON_ERROR_STOP=1 -f database/migrations/0004_subscription_cash_ledger.sql
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Execute trusted statement locking against PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lequ_v6
        run: pnpm --filter @lequ/api exec tsx integration/distribution-lock.ts
