name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci --include=dev
          test -x node_modules/.bin/vitest
          test -x node_modules/.bin/vue-tsc
          test -x node_modules/.bin/esbuild

      - name: Run project quality gate
        run: node scripts/quality-gate.mjs

      - name: Build WeChat mini programs
        run: npm run build:weixin
          fi
