<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>小满 AI · 乐趣生活</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background: #191511;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 36px 16px 60px;
        color: #f6f2e5;
      }
      .cap {
        margin-bottom: 18px;
        text-align: center;
      }
      .cap h1 {
        font-size: 22px;
        letter-spacing: 0.1em;
        font-weight: 900;
      }
      .cap p {
        font-size: 12px;
        margin-top: 6px;
        letter-spacing: 0.12em;
        opacity: 0.55;
      }

      .phone {
        --hd1: #009146;
        --hd2: #006b36;
        --bg: #f6f1e6;
        --card: #ffffff;
        --ink: #16130f;
        --mut: #857c6d;
        --accent: #009146;
        --promo: #f03749;
        --hot: #eb6325;
        --yel: #fee600;
        --tabbar: #ffffff;
        --line: rgba(22, 19, 15, 0.08);
        --notice-bg: #e6f3ea;
        --notice-tx: #0b6b3d;
        --capsule-bg: rgba(255, 255, 255, 0.94);
        --capsule-line: rgba(22, 19, 15, 0.12);
        --capsule-ink: #16130f;
        --cnt-bg: #16130f;
        --cnt-tx: #fee600;
        --shadow: 0 10px 26px rgba(22, 19, 15, 0.09);
      }
      .phone[data-theme='dark'] {
        --hd1: #10241a;
        --hd2: #0c1212;
        --bg: #0c1212;
        --card: #141d1d;
        --ink: #ffffff;
        --mut: #9fb0a8;
        --accent: #6ec726;
        --promo: #ff5d3d;
        --hot: #f7c400;
        --yel: #f7c400;
        --tabbar: #0a0f0f;
        --line: rgba(255, 255, 255, 0.08);
        --notice-bg: rgba(110, 199, 38, 0.13);
        --notice-tx: #8fe33f;
        --capsule-bg: rgba(12, 18, 18, 0.45);
        --capsule-line: rgba(255, 255, 255, 0.22);
        --capsule-ink: #ffffff;
        --cnt-bg: #0c1212;
        --cnt-tx: #6ec726;
        --shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
      }

      /* ===== 骨架 ===== */
      .phone {
        width: 375px;
        height: 760px;
        background: var(--bg);
        border-radius: 44px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        flex: none;
        color: var(--ink);
        box-shadow:
          0 30px 80px -20px rgba(0, 0, 0, 0.55),
          0 0 0 10px #141210;
        transition: background 0.5s;
      }
      .scroll {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        background: linear-gradient(180deg, var(--tint, #efe9db) 0px, var(--bg) 430px);
      }
      .scroll::-webkit-scrollbar {
        display: none;
      }
      [data-theme='dark'] .scroll {
        background: var(--bg);
      }
      .statusbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink);
        padding: 14px 26px 0;
        position: relative;
        z-index: 2;
      }
      [data-theme='dark'] .statusbar {
        color: #fff;
      }
      .pnav {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px 12px;
        position: relative;
        z-index: 2;
      }
      .back {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 50%;
        background: var(--card);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        color: var(--ink);
        text-decoration: none;
        box-shadow: 0 3px 10px rgba(22, 19, 15, 0.06);
        cursor: pointer;
      }
      .ptitle {
        flex: 1;
        min-width: 0;
        font-size: 16.5px;
        font-weight: 900;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .capsule {
        width: 87px;
        height: 32px;
        flex: none;
        border-radius: 16px;
        background: var(--capsule-bg);
        border: 1px solid var(--capsule-line);
        display: flex;
        overflow: hidden;
        backdrop-filter: blur(8px);
      }
      .capsule .cell {
        flex: 1;
        display: grid;
        place-items: center;
        height: 100%;
      }
      .capsule .cell:first-child {
        border-right: 1px solid var(--capsule-line);
      }
      /* ===== 通用组件 ===== */
      .card {
        margin: 12px 14px 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 14px;
        transition: background 0.5s;
      }
      .sec {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 18px 18px 10px;
      }
      .sec b {
        font-size: 15.5px;
        font-weight: 900;
        letter-spacing: 0.02em;
      }
      .sec a {
        font-size: 11px;
        font-weight: 800;
        color: var(--accent);
        text-decoration: none;
      }
      .lrow {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 13px 2px;
        border-top: 1px solid var(--line);
        text-decoration: none;
        color: var(--ink);
      }
      .lrow:first-child {
        border-top: none;
      }
      .lrow .lic {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        color: #fff;
        flex: none;
      }
      .lrow .ltx {
        flex: 1;
        min-width: 0;
      }
      .lrow .ltx b {
        font-size: 13.5px;
        font-weight: 900;
        display: block;
      }
      .lrow .ltx p {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--mut);
        margin-top: 2px;
      }
      .lrow .lgo {
        flex: none;
        color: var(--mut);
        font-size: 11px;
        font-weight: 800;
      }
      .chiprow {
        display: flex;
        gap: 8px;
        padding: 2px 14px 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .chiprow::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex: none;
        font-size: 11.5px;
        font-weight: 800;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 14px;
        text-decoration: none;
        transition: 0.3s;
      }
      .chip.on {
        background: linear-gradient(120deg, #00a850, #007a3d);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 3px 8px rgba(0, 145, 70, 0.28);
      }
      /* 团购卡 */
      .deal {
        display: flex;
        gap: 11px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 11px;
        margin: 10px 14px 0;
        text-decoration: none;
        color: var(--ink);
        transition: background 0.5s;
      }
      .dimgbox {
        position: relative;
        width: 96px;
        height: 96px;
        flex: none;
      }
      .dimgbox img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 12px;
      }
      .dtag {
        position: absolute;
        left: 5px;
        top: 5px;
        background: linear-gradient(120deg, #ff5d3d, #f03749);
        color: #fff;
        font-size: 8.5px;
        font-weight: 900;
        border-radius: 6px;
        padding: 2px 6px;
      }
      .dinfo {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .dshop {
        font-size: 12.5px;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dstar {
        font-size: 10px;
        font-weight: 900;
        color: #f7a800;
      }
      .ddist {
        margin-left: auto;
        font-size: 9.5px;
        font-weight: 700;
        color: var(--mut);
      }
      .dtit {
        font-size: 11px;
        font-weight: 700;
        color: var(--mut);
        margin-top: 3px;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .drules {
        display: flex;
        gap: 5px;
        margin-top: 5px;
      }
      .drules i {
        font-style: normal;
        font-size: 8.5px;
        font-weight: 800;
        color: var(--notice-tx);
        background: var(--notice-bg);
        border-radius: 4px;
        padding: 1.5px 5px;
      }
      .drow {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-top: auto;
        padding-top: 6px;
      }
      .dprice {
        font-size: 17px;
        font-weight: 900;
        color: var(--promo);
      }
      .dprice s {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--mut);
        margin-left: 4px;
      }
      .dsold {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--mut);
      }
      .dbuy {
        font-size: 11px;
        font-weight: 900;
        color: #fff;
        background: linear-gradient(120deg, #ff6a3d, #f03749);
        border-radius: 999px;
        padding: 7px 13px;
        box-shadow: 0 4px 10px rgba(240, 55, 73, 0.3);
      }
      /* 商品卡 */
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 10px 14px 0;
      }
      .gcell {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        text-decoration: none;
        color: var(--ink);
        box-shadow: var(--shadow);
        transition: background 0.5s;
      }
      .gcell img {
        width: 100%;
        height: 118px;
        object-fit: cover;
        display: block;
      }
      .gcell .gt {
        padding: 9px 11px 11px;
      }
      .gcell .gt b {
        font-size: 12px;
        font-weight: 800;
        display: block;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .gtag {
        display: inline-block;
        font-size: 8.5px;
        font-weight: 800;
        color: var(--notice-tx);
        background: var(--notice-bg);
        border-radius: 4px;
        padding: 1.5px 5px;
        margin-top: 5px;
      }
      .grow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 7px;
      }
      .gp {
        font-size: 15px;
        font-weight: 900;
        color: var(--promo);
      }
      .gp s {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--mut);
        margin-left: 3px;
      }
      .gplus {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00c853, #009146);
        color: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 3px 8px rgba(0, 145, 70, 0.35);
      }
      /* 底栏 */
      .bb {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        background: var(--card);
        border-top: 1px solid var(--line);
        padding: 10px 14px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .bb .bico {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 8.5px;
        font-weight: 800;
        color: var(--mut);
        text-decoration: none;
        width: 44px;
      }
      .bb .bbtn {
        flex: 1;
        height: 44px;
        border: none;
        border-radius: 22px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 900;
        color: #fff;
        background: linear-gradient(120deg, #00c853, #009146);
        box-shadow: 0 8px 18px rgba(0, 145, 70, 0.35);
        cursor: pointer;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bb .bbtn.hot {
        background: linear-gradient(120deg, #ff6a3d, #f03749);
        box-shadow: 0 8px 18px rgba(240, 55, 73, 0.35);
      }
      /* 优惠券 */
      .cpn {
        display: flex;
        margin: 10px 14px 0;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow);
        text-decoration: none;
        color: var(--ink);
      }
      .cpn .cl {
        width: 104px;
        flex: none;
        background: linear-gradient(140deg, #ff8a5c, #f03749);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 14px 6px;
      }
      .cpn .cl b {
        font-size: 24px;
        font-weight: 900;
      }
      .cpn .cl b i {
        font-style: normal;
        font-size: 12px;
      }
      .cpn .cl p {
        font-size: 9px;
        font-weight: 800;
        opacity: 0.9;
        margin-top: 2px;
      }
      .cpn .cr {
        flex: 1;
        background: var(--card);
        border: 1px solid var(--line);
        border-left: none;
        padding: 11px 12px;
        position: relative;
      }
      .cpn .cr b {
        font-size: 12.5px;
        font-weight: 900;
        display: block;
      }
      .cpn .cr p {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--mut);
        margin-top: 3px;
      }
      .cpn .cr .cuse {
        position: absolute;
        right: 11px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 10px;
        font-weight: 900;
        color: var(--promo);
        border: 1px solid var(--promo);
        border-radius: 999px;
        padding: 5px 11px;
      }
      /* 提示条 */
      .ntc {
        margin: 12px 14px 0;
        height: 36px;
        border-radius: 12px;
        background: var(--notice-bg);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        font-size: 10.5px;
        font-weight: 800;
        color: var(--notice-tx);
      }
      /* 入场动画 */
      .fu {
        opacity: 0;
        transform: translateY(14px);
        transition:
          opacity 0.55s ease,
          transform 0.55s ease;
      }
      .fu.in {
        opacity: 1;
        transform: none;
      }
      /* toast */
      #toast {
        position: absolute;
        left: 50%;
        bottom: 110px;
        transform: translateX(-50%) translateY(8px);
        max-width: 300px;
        background: rgba(22, 19, 15, 0.92);
        color: #fff;
        font-size: 11.5px;
        font-weight: 700;
        border-radius: 12px;
        padding: 10px 14px;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
        z-index: 60;
        line-height: 1.5;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      /* 小满悬浮球 */
      .maifab {
        position: absolute;
        right: 12px;
        bottom: 92px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 30;
        box-shadow:
          0 8px 20px rgba(22, 19, 15, 0.16),
          0 0 0 4px rgba(0, 200, 130, 0.1);
        animation: maipulse 2.8s infinite;
        cursor: pointer;
        text-decoration: none;
        color: var(--ink);
      }
      .maifab img {
        width: 31px;
        height: 31px;
      }
      .maifab em {
        font-style: normal;
        font-size: 8.5px;
        font-weight: 900;
        margin-top: -1px;
      }
      [data-theme='dark'] .maifab {
        background: rgba(20, 26, 24, 0.94);
      }
      @keyframes maipulse {
        0%,
        100% {
          box-shadow:
            0 8px 20px rgba(22, 19, 15, 0.16),
            0 0 0 4px rgba(0, 200, 130, 0.1);
        }
        50% {
          box-shadow:
            0 8px 20px rgba(22, 19, 15, 0.16),
            0 0 0 8px rgba(0, 200, 130, 0.04);
        }
      }
      @media (max-width: 480px) {
        body {
          padding: 0;
        }
        .phone {
          width: 100%;
          height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }
        .cap {
          display: none;
        }
      }

      .chat {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 4px 14px;
      }
      .msg {
        display: flex;
        gap: 9px;
        align-items: flex-start;
      }
      .msg.me {
        justify-content: flex-end;
      }
      .mava {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #fff;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        flex: none;
        box-shadow: 0 4px 10px rgba(22, 19, 15, 0.1);
      }
      .mava img {
        width: 24px;
        height: 24px;
      }
      .bub {
        max-width: 270px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 4px 16px 16px 16px;
        padding: 11px 13px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.7;
        box-shadow: var(--shadow);
      }
      .msg.me .bub {
        background: linear-gradient(135deg, #00c853, #009146);
        color: #fff;
        border: none;
        border-radius: 16px 4px 16px 16px;
      }
      .aideal {
        display: flex;
        gap: 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 10px;
        max-width: 290px;
        text-decoration: none;
        color: var(--ink);
        box-shadow: var(--shadow);
      }
      .aideal img {
        width: 64px;
        height: 64px;
        border-radius: 11px;
        object-fit: cover;
        flex: none;
      }
      .aideal b {
        font-size: 12.5px;
        font-weight: 900;
        display: block;
      }
      .aideal p {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--mut);
        margin: 3px 0 7px;
      }
      .qa2 {
        font-size: 10.5px;
        font-weight: 800;
        color: var(--accent);
        background: var(--notice-bg);
        border-radius: 999px;
        padding: 7px 12px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="cap">
      <h1>乐趣生活</h1>
      <p>乐趣生活 · 概念设计</p>
    </div>
    <div class="phone" id="app">
      <div class="scroll" style="--tint: #dff3ef">
        <div class="statusbar">
          <span>9:41</span>
          <span style="display: flex; gap: 5px; align-items: center">
            <svg width="16" height="11" viewBox="0 0 17 12" fill="currentColor">
              <rect x="0" y="7" width="3" height="5" rx="1" />
              <rect x="4.5" y="5" width="3" height="7" rx="1" />
              <rect x="9" y="2.5" width="3" height="9.5" rx="1" />
              <rect x="13.5" y="0" width="3" height="12" rx="1" />
            </svg>
            <svg width="23" height="11" viewBox="0 0 25 12">
              <rect
                x="0.5"
                y="0.5"
                width="20"
                height="11"
                rx="3"
                fill="none"
                stroke="currentColor"
              />
              <rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="currentColor" />
              <path d="M23 4v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </span>
        </div>
        <div class="pnav">
          <a class="back" id="bk" href="index.html"
            ><svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M14.5 5.5 8 12l6.5 6.5" /></svg
          ></a>
          <div class="ptitle">小满 AI</div>
          <div class="capsule">
            <div class="cell">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--capsule-ink)">
                <use href="#cap-more" />
              </svg>
            </div>
            <div class="cell">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--capsule-ink)"
              >
                <use href="#cap-target" />
              </svg>
            </div>
          </div>
        </div>

        <div class="chat" id="chat">
          <div class="msg ai fu">
            <span class="mava"><img src="../assets/icons/mai.png" alt="" /></span>
            <div class="bub">
              你好呀，我是小满 🌱<br />想吃啥、想去哪、想充话费、想给家里做个保洁……一句话告诉我，我帮你组合
              32 项生活能力直接下单。
            </div>

    <script>
      var app = document.getElementById('app');
      if (location.search.indexOf('theme=dark') > -1) app.setAttribute('data-theme', 'dark');
      // 主题随链接传递
      document.querySelectorAll('a[href$=".html"],a[href*=".html?"]').forEach(function (a) {
        if (app.getAttribute('data-theme') === 'dark' && a.href.indexOf('theme=dark') < 0)
          a.href += (a.href.indexOf('?') > -1 ? '&' : '?') + 'theme=dark';
      });
      // 返回
      var bk = document.getElementById('bk');
      if (bk)
        bk.addEventListener('click', function (e) {
          e.preventDefault();
          if (history.length > 1) history.back();
          else location.href = 'index.html';
        });
      // toast
      var toast = document.getElementById('toast'),
        tt;
      document.addEventListener('click', function (e) {
        var el = e.target.closest('[data-t]');
        if (el) {
          e.preventDefault();
          toast.textContent = el.getAttribute('data-t');
          toast.classList.add('show');
          clearTimeout(tt);
          tt = setTimeout(function () {
            toast.classList.remove('show');
          }, 2300);
        }
      });
      // 入场动画
      var io = new IntersectionObserver(
        function (es) {
          es.forEach(function (x) {
            if (x.isIntersecting) {
              x.target.classList.add('in');
              io.unobserve(x.target);
            }
          });
        },
        { root: document.querySelector('.scroll'), threshold: 0.05 },
      );
      document.querySelectorAll('.fu').forEach(function (el) {
        io.observe(el);
      });
      if (location.search.indexOf('snap=1') > -1)
        document.querySelectorAll('.fu').forEach(function (el) {
          el.style.transition = 'none';
          el.classList.add('in');
        });
    </script>
