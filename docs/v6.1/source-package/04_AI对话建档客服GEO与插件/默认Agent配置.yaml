schema_version: 1
agent_id: merchant_ai_service
name: 商家小程序AI店员
runtime: deepseek_harness
scope:
  tenant_required: true
  store_required: true
  customer_consent_required_for_profile: true
limits:
  max_plan_steps: 8
  max_tool_calls: 12
  step_timeout_seconds: 30
  task_timeout_seconds: 180
  max_retries_per_read_tool: 1
  max_retries_per_write_tool: 0
knowledge:
  namespaces:
    - platform_rules
    - industry_template
    - merchant_knowledge
    - store_knowledge
  filter_before_search:
    - tenant_id
    - store_id
    - effective_at
  max_results: 6
tools:
  auto_allowed:
    - knowledge.search
    - catalog.read
    - groupbuy.read
    - store.read_public
    - order.read_self
    - refund.read_self
  human_confirmation_required:
    - ticket.create
    - customer_profile.update
  forbidden:
    - refund.approve
    - compensation.create
    - price.update
    - customer.export
    - permission.update
handoff:
  confidence_answer_threshold: 0.82
  confidence_clarify_threshold: 0.65
  explicit_human_request: immediate
  high_risk: immediate
  tool_failures_before_handoff: 2
memory:
  product_name: 持续客户档案
  auto_write_sensitive_data: false
  raw_conversation_retention_days: 180
  profile_retention_months_after_last_interaction: 24
audit:
  store_sources: true
  store_tool_results_summary: true
  redact_sensitive_fields: true
