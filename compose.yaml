name: lequbao-bao-preview

services:
  postgres:
    image: postgres:15-bookworm@sha256:cf7f8fb958c63e62875e30645dc4819ff0243a923f3c709e752b99dedd40bfcd
    restart: unless-stopped
    environment:
      POSTGRES_DB: lequ_v6
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lequ-preview-db-internal-only
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lequ_v6']
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/opt/lequ-database:ro
      - ./deploy/init-bao-preview-postgres.sh:/docker-entrypoint-initdb.d/001-preview-init.sh:ro

  migrate:
    image: postgres:15-bookworm@sha256:cf7f8fb958c63e62875e30645dc4819ff0243a923f3c709e752b99dedd40bfcd
    restart: 'on-failure:5'
    environment:
      PGHOST: postgres
      PGDATABASE: lequ_v6
      PGUSER: postgres
      PGPASSWORD: lequ-preview-db-internal-only
      LEQU_DEVELOPMENT_MOCKS: '1'
      LEQU_PUBLIC_PREVIEW: '1'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database:/opt/lequ-database:ro
      - ./deploy/migrate-bao-preview-postgres.sh:/opt/lequ-migrate.sh:ro
    command: ['bash', '/opt/lequ-migrate.sh']

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: preview
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LEQU_DEVELOPMENT_MOCKS: '1'
      LEQU_PUBLIC_PREVIEW: '1'
      LEQU_PREVIEW_HOSTNAME: bao.lequ.com
      DATABASE_URL: postgres://postgres:lequ-preview-db-internal-only@postgres:5432/lequ_v6
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '${LEQU_PREVIEW_PORT:-8080}:8080'

volumes:
  postgres-data:
