services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    working_dir: /workspaces/lequ-life-platform
    volumes:
      - ..:/workspaces/lequ-life-platform:cached
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/lequ_v6
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: lequ_v6
      PGUSER: postgres
      PGPASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-bookworm@sha256:cf7f8fb958c63e62875e30645dc4819ff0243a923f3c709e752b99dedd40bfcd
    restart: unless-stopped
    environment:
      POSTGRES_DB: lequ_v6
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lequ_v6']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
