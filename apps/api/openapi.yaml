openapi: 3.1.0
info:
  title: 乐趣生活 V5.0 Platform API
  version: 5.0.0
servers:
  - url: http://127.0.0.1:8787/api/v1
security:
  - bearerAuth: []
paths:
  /auth/session:
    get:
      operationId: getAuthSession
      summary: 获取当前租户会话、角色与数据范围
      responses:
        '200':
          description: 当前有效会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Problem'
  /onboarding/overview:
    get:
      operationId: getOnboardingOverview
      summary: 获取当前数据范围内的商家入网工作台
      parameters:
        - name: focusLeadId
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: 入网指标、线索和聚焦商家的完整业务视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingOverview'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /onboarding/leads:
    post:
      operationId: createOnboardingLead
      summary: 创建销售线索并建立 30 天归属保护
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeadInput'
      responses:
        '200':
          description: 创建后的入网工作台
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingOverview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /onboarding/leads/{leadId}/diagnosis:
    post:
      operationId: runMerchantDiagnosis
      summary: 运行 AI 商家体检并保存模型版本与证据
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/VersionMutation'
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /onboarding/leads/{leadId}/followups:
    post:
      operationId: addLeadFollowUp
      summary: 追加 CRM 跟进记录并安排下一动作
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [channel, summary, nextAction, nextActionAt]
                  properties:
                    channel: { type: string, enum: [PHONE, WECHAT, VISIT, VIDEO] }
                    summary: { type: string, minLength: 3, maxLength: 500 }
                    nextAction: { type: string, minLength: 2, maxLength: 160 }
                    nextActionAt: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /onboarding/leads/{leadId}/lost:
    post:
      operationId: markLeadLost
      summary: 以结构化原因关闭商机并保留重新激活信息
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [reason, note]
                  properties:
                    reason: { type: string, enum: [NO_BUDGET, NO_DECISION, COMPETITOR, TIMING, INVALID, OTHER] }
                    note: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /onboarding/leads/{leadId}/collaborators:
    post:
      operationId: addLeadCollaborator
      summary: 添加同租户跨角色协作人
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [userId, role]
                  properties:
                    userId: { type: string }
                    role: { type: string, enum: [CO_OWNER, DELIVERY_PARTNER, OBSERVER] }
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /onboarding/leads/{leadId}/contracts:
    post:
      operationId: createMerchantContract
      summary: 生成套餐合同草稿并执行折扣权限规则
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [packageCode, discountBps]
                  properties:
                    packageCode: { type: string, enum: [BASIC, PRO, AGENT, CHAIN] }
                    discountBps: { type: integer, minimum: 0, maximum: 3000 }
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /onboarding/contracts/{contractId}/sign:
    post:
      operationId: signMerchantContract
      summary: 签署合同并分别保存六类授权证据
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [leadId]
                  properties:
                    leadId: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /onboarding/contracts/{contractId}/discount-decision:
    post:
      operationId: decideContractDiscount
      summary: 由具备折扣审批权限的角色批准或驳回超限折扣
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [leadId, decision, note]
                  properties:
                    leadId: { type: string }
                    decision: { type: string, enum: [APPROVE, REJECT] }
                    note: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /onboarding/leads/{leadId}/assets/capture:
    post:
      operationId: captureOnboardingAssets
      summary: 采集执照、门头和菜单并创建人工确认任务
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/VersionMutation'
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /onboarding/leads/{leadId}/assets/upload:
    post:
      operationId: uploadOnboardingAsset
      summary: 上传单个资料原件，保存不可变二进制版本并运行识别适配器
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Asset-Type
          in: header
          required: true
          schema: { type: string, enum: [BUSINESS_LICENSE, STOREFRONT, MENU] }
        - name: X-File-Name
          in: header
          required: true
          description: URI 编码后的文件名
          schema: { type: string }
        - name: X-Mime-Type
          in: header
          required: true
          schema: { type: string }
        - name: X-Expected-Version
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 8388608 }
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
  /onboarding/assets/{assetId}/confirm:
    post:
      operationId: confirmOnboardingAsset
      summary: 人工校对并确认一项识别资产
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [leadId, corrected]
                  properties:
                    leadId: { type: string }
                    corrected: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /onboarding/leads/{leadId}/transfer:
    post:
      operationId: transferOnboardingLead
      summary: 经授权转移线索并重算保护期
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [targetOwnerId, reason]
                  properties:
                    targetOwnerId: { type: string }
                    reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /onboarding/leads/{leadId}/appeals:
    post:
      operationId: submitLeadAppeal
      summary: 提交线索归属争议申诉与证据
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, evidence]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
                evidence:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200': { $ref: '#/components/responses/OnboardingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
  /sales/workbench:
    get:
      operationId: getSalesWorkbench
      summary: 获取销售今日任务、重点商机、提醒与可解释 AI 下一步建议
      responses:
        '200':
          description: 当前销售数据范围内的今日工作台
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesWorkbenchOverview' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /sales/crm:
    get:
      operationId: getSalesCrm
      summary: 获取销售数据范围内的线索列表、组合筛选、跟进聚合与可信位置
      parameters:
        - name: keyword
          in: query
          schema: { type: string, maxLength: 80 }
        - name: stage
          in: query
          schema:
            type: string
            enum: [NEW, DIAGNOSED, CONTRACT_DRAFT, SIGNED, ASSET_REVIEW, READY_FOR_DELIVERY, LOST]
        - name: source
          in: query
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: timing
          in: query
          schema:
            type: string
            enum: [ALL, OVERDUE, TODAY, UPCOMING]
            default: ALL
      responses:
        '200':
          description: 列表和地图共享同一份 SQL 数据范围与 CRM 事实
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesCrmOverview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /sales/ownership/{leadId}:
    get:
      operationId: getSalesOwnership
      summary: 获取线索负责人、保护期、转移、申诉、协作与不可变证据链
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: 当前角色数据范围内的归属治理读模型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesOwnershipOverview' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /sales/ownership/{leadId}/transfer-requests:
    post:
      operationId: createLeadTransferRequest
      summary: 负责人提交带证据的同城转移申请，不直接改变归属
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetOwnerId, reason, evidence, expectedLeadVersion]
              properties:
                targetOwnerId: { type: string, minLength: 1, maxLength: 100 }
                reason: { type: string, minLength: 5, maxLength: 500 }
                evidence:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, minLength: 2, maxLength: 300 }
                expectedLeadVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已创建待审批申请，负责人保持不变
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesOwnershipOverview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /sales/ownership/transfer-requests/{requestId}/decision:
    post:
      operationId: decideLeadTransferRequest
      summary: 城市负责人或总部批准/拒绝转移，批准后重算保护期并保留原负责人协作
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, note, expectedVersion]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                note: { type: string, minLength: 5, maxLength: 500 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已追加裁决事件并返回归属治理读模型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesOwnershipOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /sales/ownership/appeals/{appealId}/decision:
    post:
      operationId: decideLeadAppeal
      summary: 城市负责人或总部裁决归属申诉并解冻保护状态
      parameters:
        - name: appealId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, note, expectedLeadVersion]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                note: { type: string, minLength: 5, maxLength: 500 }
                expectedLeadVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 申诉已裁决，保护期按规则解冻或重算
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesOwnershipOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /sales/performance:
    get:
      operationId: getSalesPerformance
      summary: 获取个人或团队的目标、三类业绩、预计/已结佣金与冲正解释
      parameters:
        - name: period
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: salespersonId
          in: query
          description: 城市负责人或总部用于钻取数据范围内的销售
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: 服务端计算的版本化目标、业绩与只追加佣金账本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesPerformanceOverview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /sales/performance/targets/{salespersonId}:
    post:
      operationId: reviseSalesTarget
      summary: 城市负责人或总部追加月度目标修订版本，不覆盖历史目标
      parameters:
        - name: salespersonId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [period, signingTargetFen, renewalTargetFen, transactionTargetFen, expectedVersion, reason]
              properties:
                period:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                signingTargetFen: { type: integer, minimum: 0, maximum: 100000000000 }
                renewalTargetFen: { type: integer, minimum: 0, maximum: 100000000000 }
                transactionTargetFen: { type: integer, minimum: 0, maximum: 100000000000 }
                expectedVersion: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: 新目标版本与该销售的更新后业绩视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesPerformanceOverview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /sales/performance/ledger/{entryId}/settle:
    post:
      operationId: settleSalesCommission
      summary: 财务强确认后追加结算流水，把预计佣金迁移到已结
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 180 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesCommissionTransitionInput' }
      responses:
        '200':
          description: 追加结算证据后的个人业绩视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesPerformanceOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /sales/performance/ledger/{entryId}/reverse:
    post:
      operationId: reverseSalesCommission
      summary: 财务强确认后追加负向流水，同步冲正业绩与预计/已结佣金
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 180 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesCommissionTransitionInput' }
      responses:
        '200':
          description: 追加冲正证据后的个人业绩视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesPerformanceOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /sales/team:
    get:
      operationId: getSalesTeam
      summary: 获取数据范围内的组织树、绩效卡、能力成长、职级事件、培养计划与可解释排行
      parameters:
        - name: period
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: focusMemberId
          in: query
          description: 管理者钻取团队成员；销售本人只能钻取自己的成员档案
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: 服务端校准的团队成长读模型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesTeamOverview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /sales/team/members/{memberId}/level-changes:
    post:
      operationId: requestSalesLevelChange
      summary: 城市负责人强确认发起相邻一级的晋升或降级申请，不直接修改职级
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesLevelChangeRequestInput' }
      responses:
        '200':
          description: 已追加待总部人才校准的职级申请事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesTeamOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
