      security: [{ EmployeeBearer: [] }]
      x-required-permission: miniprogram.manage
      parameters: [{ $ref: '#/components/parameters/MiniProgramId' }]
      responses:
        '200':
          description: 当前可见版本和线上稳定版本指针
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiniProgram' }
        '409': { description: 小程序不存在于当前租户 }
  /api/v1/mini-programs/{miniProgramId}/releases:
    post:
      operationId: createMerchantMiniProgramPreview
