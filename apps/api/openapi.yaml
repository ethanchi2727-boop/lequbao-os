    SessionIdentity:
      type: object
      additionalProperties: false
      required: [tenantId, userId, roleCodes, storeIds, sessionId, authLevel]
      properties:
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        roleCodes: { type: array, minItems: 1, items: { type: string } }
        storeIds: { type: array, items: { type: string, format: uuid } }
        sessionId: { type: string, format: uuid }
        authLevel: { type: string, enum: [PASSWORD, MFA] }
    SessionTokens:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, accessTokenExpiresAt, sessionExpiresAt, identity]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        sessionExpiresAt: { type: string, format: date-time }
        identity: { $ref: '#/components/schemas/SessionIdentity' }
    RevenueRightHolder:
      type: object
      additionalProperties: false
      required: [beneficiaryId, shareBps]
      properties:
        beneficiaryId: { type: string, format: uuid }
        shareBps: { type: integer, minimum: 1, maximum: 7000 }
    CreateRevenueRightRequest:
      type: object
      additionalProperties: false
      required: [sourceContractRef, startsAt, createdBy, holders]
      properties:
        sourceContractRef: { type: string, minLength: 1, maxLength: 255 }
        startsAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        evidence: { type: object, additionalProperties: true, default: {} }
        holders:
          type: array
          minItems: 1
          description: 受益人不可重复，shareBps 合计必须恰好为 7000。
          items:
            $ref: '#/components/schemas/RevenueRightHolder'
    RevenueRight:
      type: object
      additionalProperties: false
      required: [id, merchantProfileId, status, startsAt, holders]
      properties:
        id: { type: string, format: uuid }
        merchantProfileId: { type: string, format: uuid }
        status: { type: string, const: ACTIVE }
        startsAt: { type: string, format: date-time }
        holders:
          type: array
          items:
            $ref: '#/components/schemas/RevenueRightHolder'
    LockDistributionRequest:
      type: object
      additionalProperties: false
      required: [periodStart, periodEnd, lockedBy]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        lockedBy: { type: string, format: uuid }
    DistributionAllocation:
      type: object
      additionalProperties: false
      required: [beneficiaryId, beneficiaryRole, shareBps, allocatedMinorUnits]
      properties:
        beneficiaryId: { type: string, format: uuid }
        beneficiaryRole:
          type: string
          enum: [ORIGINATING_BUSINESS, SHANGZHI, LEQU_LIFE]
        shareBps: { type: integer, minimum: 1, maximum: 10000 }
        allocatedMinorUnits: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
    LockedDistribution:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - policyVersion
        - actualReceiptMinorUnits
        - refundMinorUnits
        - directCostMinorUnits
        - distributableMinorUnits
        - allocations
      properties:
        id: { type: string, format: uuid }
        status: { type: string, const: LOCKED }
        policyVersion: { type: integer, minimum: 1 }
        actualReceiptMinorUnits: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        refundMinorUnits: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        directCostMinorUnits: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        distributableMinorUnits: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        allocations:
          type: array
          minItems: 3
          items:
            $ref: '#/components/schemas/DistributionAllocation'
    RequestDistributionApproval:
      type: object
      additionalProperties: false
      required: [actionType, reasonCode, requestedBy, expiresAt]
      properties:
        actionType: { type: string, enum: [PAY, REVERSE] }
        reasonCode: { type: string, minLength: 1, maxLength: 80 }
        requestedBy: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
    ApproveDistributionAction:
      type: object
      additionalProperties: false
      required: [approvedBy]
      properties:
        approvedBy: { type: string, format: uuid }
    DistributionApproval:
      type: object
      additionalProperties: false
      required:
        [id, statementId, actionType, reasonCode, status, requestedBy, approvedBy, expiresAt]
      properties:
        id: { type: string, format: uuid }
        statementId: { type: string, format: uuid }
        actionType: { type: string, enum: [PAY, REVERSE] }
        reasonCode: { type: string }
        status: { type: string, enum: [PENDING, APPROVED] }
        requestedBy: { type: string, format: uuid }
        approvedBy:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        expiresAt: { type: string, format: date-time }
    DistributionPaymentProof:
      type: object
      additionalProperties: false
      required: [allocationId, providerPaymentRefHash]
      properties:
        allocationId: { type: string, format: uuid }
        providerPaymentRefHash: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    PayDistributionStatement:
      type: object
      additionalProperties: false
      required: [approvalId, executedBy, provider, completedAt, payments]
      properties:
        approvalId: { type: string, format: uuid }
        executedBy: { type: string, format: uuid }
        provider: { type: string, minLength: 1, maxLength: 80 }
        completedAt: { type: string, format: date-time }
        payments:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DistributionPaymentProof' }
    ReverseDistributionStatement:
      type: object
      additionalProperties: false
      required: [approvalId, executedBy, reasonCode]
      properties:
        approvalId: { type: string, format: uuid }
        executedBy: { type: string, format: uuid }
        reasonCode: { type: string, minLength: 1, maxLength: 80 }
    DistributionSettlementResult:
      type: object
      additionalProperties: false
      required: [statementId, status, entryIds]
      properties:
        statementId: { type: string, format: uuid }
        status: { type: string, enum: [PAID, REVERSED] }
        entryIds:
          type: array
          items: { type: string, format: uuid }
    CreateMerchantIntakeSession:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        merchantProfileId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        deliveryProjectId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        channel: { type: string, enum: [WEB, MOBILE_H5, WECOM] }
        initialText:
          oneOf: [{ type: string, minLength: 1, maxLength: 4000 }, { type: 'null' }]
    MerchantIntakeField:
      type: object
      additionalProperties: false
      required: [id, fieldPath, candidateValue, confidence, decisionStatus, sourceAssetId]
      properties:
        id: { type: string, format: uuid }
        fieldPath: { type: string }
        candidateValue: {}
        confidence:
          oneOf: [{ type: number, minimum: 0, maximum: 1 }, { type: 'null' }]
        decisionStatus: { type: string, enum: [PROPOSED, CONFIRMED, CORRECTED, REJECTED, CONFLICT] }
        sourceAssetId: { type: string, format: uuid }
    MerchantIntakeSession:
      type: object
      additionalProperties: false
      required:
        [
          id,
          merchantProfileId,
          deliveryProjectId,
          channel,
          status,
          fields,
          missingItems,
          impactTargets,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        merchantProfileId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        deliveryProjectId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        channel: { type: string, enum: [WEB, MOBILE_H5, WECOM] }
        status:
          {
            type: string,
            enum:
              [
                COLLECTING,
                EXTRACTING,
                WAITING_ANSWERS,
                WAITING_CONFIRMATION,
                CONFIRMED,
                PUBLISHING,
                COMPLETED,
                FAILED,
                CANCELLED,
              ],
          }
        fields:
          type: array
          items: { $ref: '#/components/schemas/MerchantIntakeField' }
        missingItems:
          type: array
          items: { type: string }
        impactTargets:
          type: array
          items: { type: string, enum: [MINI_PROGRAM, GEO, AI_SERVICE, PRODUCT, GROUP_BUY] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateMerchantIntakeUpload:
      type: object
      additionalProperties: false
      required: [assetType, sha256, contentType, maxBytes]
      properties:
        assetType: { type: string, enum: [IMAGE, DOCUMENT, AUDIO] }
        sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        contentType: { type: string, minLength: 1, maxLength: 255 }
        maxBytes: { type: integer, minimum: 1, maximum: 52428800 }
    MerchantIntakeUploadAuthorization:
      type: object
      additionalProperties: false
      required: [id, sessionId, objectKey, uploadUrl, headers, expiresAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        objectKey: { type: string }
        uploadUrl: { type: string, format: uri }
        headers:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
    MerchantIntakeUploadCompletion:
      type: object
      additionalProperties: false
      required: [uploadId, assetId, sessionId, securityStatus, processingStatus]
      properties:
        uploadId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        securityStatus: { type: string, const: PENDING }
        processingStatus: { type: string, const: QUEUED }
    AddMerchantIntakeMessage:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
        sourceMessageId:
          oneOf: [{ type: string, minLength: 1, maxLength: 255 }, { type: 'null' }]
    ConfirmMerchantIntakeFields:
      type: object
      additionalProperties: false
      required:
        [confirmationType, confirmedPayload, candidateIds, confirmationChannel, expectedVersion]
      properties:
        confirmationType:
          {
            type: string,
            enum: [LEGAL_SUBJECT, PAYMENT, PRICE, REFUND_RULE, PUBLIC_CONTACT, PUBLISH_IMPACT],
          }
        confirmedPayload: { type: object, additionalProperties: true }
        candidateIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        confirmationChannel: { type: string, enum: [WEB_CLICK, MOBILE_CLICK, WECOM_SECURE_CARD] }
        expectedVersion: { type: integer, minimum: 1 }
    CommitMerchantIntakeSession:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    MerchantIntakeCommitResult:
      type: object
      additionalProperties: false
      required: [sessionId, merchantProfileId, status, changedFieldPaths, impactTargets]
      properties:
        sessionId: { type: string, format: uuid }
        merchantProfileId: { type: string, format: uuid }
        status: { type: string, const: CONFIRMED }
        changedFieldPaths:
          type: array
          items: { type: string }
        impactTargets:
          type: array
          items: { type: string, enum: [MINI_PROGRAM, GEO, AI_SERVICE, PRODUCT, GROUP_BUY] }
