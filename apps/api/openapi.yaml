              properties:
                fileName: { type: string, minLength: 3, maxLength: 180 }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [type, name, category, description, mediaCompletion, skuCode, skuName, priceFen, stockMode, stockQuantity, lowStockThreshold]
                    properties:
                      type: { type: string, enum: [PRODUCT, SERVICE, PACKAGE] }
                      name: { type: string, minLength: 1, maxLength: 120 }
                      category: { type: string, minLength: 1, maxLength: 80 }
                      description: { type: string, minLength: 1, maxLength: 1000 }
                      mediaCompletion: { type: integer }
                      skuCode: { type: string, minLength: 1, maxLength: 80 }
                      skuName: { type: string, minLength: 1, maxLength: 120 }
                      priceFen: { type: integer }
                      stockMode: { type: string, enum: [FINITE, UNLIMITED, SLOT] }
                      stockQuantity: { type: integer, minimum: 0 }
                      lowStockThreshold: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/MerchantCatalogOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchant/catalog/imports/{importId}/apply:
    post:
      operationId: applyMerchantCatalogImport
      summary: 强确认预检无误的导入任务并创建商品草稿
      parameters:
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [confirmed]
                  properties:
                    confirmed: { type: boolean, const: true }
      responses:
        '200': { $ref: '#/components/responses/MerchantCatalogOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchant/members/overview:
    get:
      operationId: getMerchantMemberOverview
