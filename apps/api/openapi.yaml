      parameters:
        - $ref: '#/components/parameters/SuiteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionMutation' }
      responses:
        '200': { $ref: '#/components/responses/SkillNetworkOverview' }
        '409': { $ref: '#/components/responses/Problem' }
  /skills/suites/{suiteId}/submit:
    post:
      operationId: submitSkillCertification
      summary: 冻结 Manifest 并提交总部认证
      parameters:
        - $ref: '#/components/parameters/SuiteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionMutation' }
      responses:
        '200': { $ref: '#/components/responses/SkillNetworkOverview' }
        '409': { $ref: '#/components/responses/Problem' }
  /skills/suites/{suiteId}/certify:
    post:
      operationId: certifySkillSuite
      summary: 以发布权限认证冻结的 Manifest 和测试证据
      parameters:
        - $ref: '#/components/parameters/SuiteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionMutation' }
      responses:
        '200': { $ref: '#/components/responses/SkillNetworkOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /skills/suites/{suiteId}/gray:
    post:
      operationId: graySkillSuite
      summary: 将已认证 Skill 放入 10% 灰度 Registry
      parameters:
        - $ref: '#/components/parameters/SuiteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionMutation' }
      responses:
        '200': { $ref: '#/components/responses/SkillNetworkOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /skills/suites/{suiteId}/publish:
    post:
      operationId: publishSkillSuite
      summary: 在 Registry 正式上线已通过灰度的 Skill
      parameters:
        - $ref: '#/components/parameters/SuiteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionMutation' }
      responses:
        '200': { $ref: '#/components/responses/SkillNetworkOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /skills/suites/{suiteId}/pause:
    post:
      operationId: pauseSkillSuite
      summary: 从发现与调用链路暂停在线 Skill 套件
      parameters:
        - $ref: '#/components/parameters/SuiteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionMutation' }
      responses:
        '200': { $ref: '#/components/responses/SkillNetworkOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /skills/suites/{suiteId}/invoke/{skillVersionId}:
    post:
      operationId: invokeSkill
