      operationId: applyConsumerDealPaymentCallback
      summary: 处理套餐支付或退款的验签、金额核对、幂等与补偿状态机
      description: 这是已验证原始微信通知后的内部连接器边界。及时支付成功消费占用并解锁商家接单；失败释放资源；取消或到期后的迟到成功记录真实收款并自动发起补偿退款，绝不复活订单。
      security: []
      parameters:
        - name: X-Payment-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ConsumerDealPaymentSucceededCallback'
                - $ref: '#/components/schemas/ConsumerDealPaymentFailedCallback'
                - $ref: '#/components/schemas/ConsumerDealRefundSucceededCallback'
                - $ref: '#/components/schemas/ConsumerDealRefundFailedCallback'
              discriminator:
                propertyName: type
      responses:
        '200':
          description: 最小连接器回执，不包含消费者资料或门店视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsumerDealConnectorCallbackReceipt' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /speech-connectors/transcription/callback:
    post:
      operationId: applySpeechTranscriptionConnectorCallback
      summary: 处理 HMAC 签名且可幂等重放的语音转写连接器回调
      security: []
      parameters:
        - name: X-Speech-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerEventId, voiceInputId, status]
              properties:
                providerEventId: { type: string, minLength: 8, maxLength: 180 }
                voiceInputId: { type: string, format: uuid }
                status: { type: string, enum: [SUCCEEDED, FAILED] }
                transcript: { type: string, minLength: 1, maxLength: 600 }
                confidence: { type: number, minimum: 0, maximum: 1 }
                language: { type: string, const: zh-CN }
                failureCode: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: 回调已接受；成功结果仍需消费者确认
          content:
            application/json:
              schema:
                type: object
                required: [accepted, replayed, voiceInputId, status]
                properties:
                  accepted: { type: boolean, const: true }
                  replayed: { type: boolean }
                  voiceInputId: { type: string, format: uuid }
                  status: { type: string, enum: [READY_FOR_CONFIRMATION, FAILED] }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /image-connectors/recognition/callback:
    post:
      operationId: applyImageRecognitionConnectorCallback
      summary: 处理 HMAC 签名且可幂等重放的图片识别连接器回调
      security: []
      parameters:
        - name: X-Image-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerEventId, imageInputId, status]
              properties:
                providerEventId: { type: string, minLength: 8, maxLength: 180 }
                imageInputId: { type: string, format: uuid }
                status: { type: string, enum: [SUCCEEDED, FAILED] }
                category: { type: string, enum: [MENU, PRODUCT, RECEIPT, ENVIRONMENT, OTHER] }
                description: { type: string, minLength: 1, maxLength: 600 }
                confidence: { type: number, minimum: 0, maximum: 1 }
                containsSensitiveData: { type: boolean }
                failureCode: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: 回调已接受；原图已删除，成功结果仍需消费者确认
          content:
            application/json:
              schema:
                type: object
                required: [accepted, replayed, imageInputId, status]
                properties:
                  accepted: { type: boolean, const: true }
                  replayed: { type: boolean }
                  imageInputId: { type: string, format: uuid }
                  status: { type: string, enum: [READY_FOR_CONFIRMATION, FAILED] }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /experience:
    get:
      operationId: getExperienceSnapshot
      summary: 获取首个垂直切片聚合快照
      responses:
        '200':
          description: 当前运行批次快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /experience/advance:
    post:
      operationId: advanceExperience
      summary: 幂等推进一个领域步骤
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedStep]
              properties:
                expectedStep:
                  type: integer
                  minimum: 1
                  maximum: 12
      responses:
        '200':
          description: 推进后的聚合快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceSnapshot'
        '409':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /experience/reset:
    post:
      operationId: resetExperience
      summary: 新建演示运行批次，保留历史审计
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 新运行批次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
    LeadId:
      name: leadId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    ContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    SuiteId:
      name: suiteId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    SkillVersionId:
      name: skillVersionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    SpuId:
      name: spuId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    SkuId:
      name: skuId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    SlotId:
      name: slotId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
  requestBodies:
    VersionMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionMutation'
  schemas:
    AuthSession:
      type: object
      additionalProperties: false
      required:
        - subject
        - displayName
        - tenantId
        - roles
        - dataScope
        - cityIds
        - merchantIds
        - storeIds
        - expiresAt
      properties:
        subject: { type: string }
        displayName: { type: string }
        tenantId: { type: string }
        roles:
          type: array
          items:
            type: string
            enum:
              - HQ_SUPER_ADMIN
              - HQ_OPERATOR
              - AI_POLICY_ADMIN
              - CITY_PROVIDER_ADMIN
              - CITY_MANAGER
              - CITY_SALES
              - CITY_DELIVERY
              - MERCHANT_OWNER
              - STORE_MANAGER
              - STORE_CLERK
              - FINANCE
        dataScope:
          type: string
          enum: [PLATFORM, CITY, OWNED_MERCHANTS, MERCHANT, STORE]
        cityIds: { type: array, items: { type: string } }
        merchantIds: { type: array, items: { type: string } }
        storeIds: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
    VersionMutation:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    CreateLeadInput:
      type: object
      additionalProperties: false
      required: [name, category, source, contactName, contactPhoneMasked, address, cityId]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        category: { type: string, minLength: 2, maxLength: 80 }
        source: { type: string, minLength: 2, maxLength: 80 }
        contactName: { type: string, minLength: 2, maxLength: 60 }
        contactPhoneMasked: { type: string, minLength: 7, maxLength: 30 }
        address: { type: string, minLength: 5, maxLength: 240 }
        cityId: { type: string, minLength: 2, maxLength: 80 }
    MiniAppTemplateCode:
      type: string
      enum: [DINING_AURORA, CAFE_EDITORIAL, RETAIL_GALLERY]
    MiniAppTemplate:
      type: object
      required: [code, name, industry, description, accent, blocks]
      properties:
        code: { $ref: '#/components/schemas/MiniAppTemplateCode' }
        name: { type: string }
        industry: { type: string }
        description: { type: string }
        accent: { type: string }
        blocks: { type: array, items: { type: string } }
    MiniAppProject:
      type: object
      required: [id, leadId, merchantName, deliveryType, status, templateCode, currentDraftVersion, nextAction, slaDueAt, version, updatedAt]
      properties:
        id: { type: string }
        leadId: { type: string }
        merchantName: { type: string }
        deliveryType: { type: string, enum: [MERCHANT_PAGE, STANDARD_MINIAPP, CHAIN_ENTERPRISE] }
        status: { type: string, enum: [DRAFT, GENERATED, PREVIEW, MERCHANT_APPROVAL, REVIEW, GRAY, LIVE, ARCHIVED] }
        templateCode: { $ref: '#/components/schemas/MiniAppTemplateCode' }
        currentDraftVersion: { type: integer }
        currentReleaseVersion: { type: [integer, 'null'] }
        nextAction: { type: string }
        slaDueAt: { type: string, format: date-time }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    MiniAppPageVersion:
      type: object
      required: [id, version, status, templateCode, schema, content, theme, previewPath, createdAt]
      properties:
        id: { type: string }
        version: { type: integer }
        status: { type: string, enum: [GENERATED, PREVIEW, APPROVED, REVIEW, GRAY, LIVE, ROLLED_BACK] }
        templateCode: { $ref: '#/components/schemas/MiniAppTemplateCode' }
        schema: { type: object, additionalProperties: true }
        content: { type: object, additionalProperties: true }
        theme: { type: object, additionalProperties: true }
        previewPath: { type: string }
        merchantApprovedBy: { type: [string, 'null'] }
        merchantApprovedAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    MiniAppFactoryOverview:
      type: object
      required: [counts, eligibleLeads, projects, focusProject, currentVersion, versions, templates, events, updatedAt]
      properties:
        counts:
          type: object
          required: [total, awaitingMerchant, inReview, live, slaRisk]
          properties:
            total: { type: integer }
            awaitingMerchant: { type: integer }
            inReview: { type: integer }
            live: { type: integer }
            slaRisk: { type: integer }
        eligibleLeads: { type: array, items: { $ref: '#/components/schemas/OnboardingLead' } }
        projects: { type: array, items: { $ref: '#/components/schemas/MiniAppProject' } }
        focusProject:
          anyOf: [{ $ref: '#/components/schemas/MiniAppProject' }, { type: 'null' }]
        currentVersion:
          anyOf: [{ $ref: '#/components/schemas/MiniAppPageVersion' }, { type: 'null' }]
        versions: { type: array, items: { $ref: '#/components/schemas/MiniAppPageVersion' } }
        templates: { type: array, items: { $ref: '#/components/schemas/MiniAppTemplate' } }
        events: { type: array, items: { $ref: '#/components/schemas/LeadActivity' } }
        updatedAt: { type: string, format: date-time }
    GeoDimension:
      type: object
      additionalProperties: false
      required: [key, label, score, maxScore, delta, status]
      properties:
        key: { type: string }
        label: { type: string }
        score: { type: integer, minimum: 0 }
        maxScore: { type: integer, minimum: 1 }
        delta: { type: integer }
        status: { type: string, enum: [EXCELLENT, GOOD, ATTENTION] }
    GeoIdentity:
      type: object
      additionalProperties: false
      required: [brandName, storeName, canonicalPoiId, aliases, address, coordinates, matchStatus, source, confidence, version]
      properties:
        brandName: { type: string }
        storeName: { type: string }
        canonicalPoiId: { type: string }
        aliases: { type: array, items: { type: string } }
        address: { type: string }
        coordinates:
          type: object
          required: [latitude, longitude]
          properties:
            latitude: { type: number }
            longitude: { type: number }
        matchStatus: { type: string, enum: [MATCHED, NEEDS_REVIEW] }
        source: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        version: { type: integer, minimum: 1 }
    GeoFact:
      type: object
      additionalProperties: false
      required: [id, fieldKey, fieldLabel, value, sourceType, sourceRef, confidence, verificationStatus, version]
      properties:
        id: { type: string }
        fieldKey: { type: string }
        fieldLabel: { type: string }
        value: { type: string }
        sourceType: { type: string }
        sourceRef: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        verificationStatus: { type: string, enum: [VERIFIED, INFERRED, NEEDS_REVIEW] }
        version: { type: integer, minimum: 1 }
    GeoChannelComparison:
      type: object
      required: [fieldKey, fieldLabel, canonicalValue, channels, consistencyRate]
      properties:
        fieldKey: { type: string }
        fieldLabel: { type: string }
        canonicalValue: { type: string }
        channels:
          type: array
          items:
            type: object
            required: [channel, value, status]
            properties:
              channel: { type: string, enum: [MERCHANT_PROFILE, MINIAPP, MAP_A, MAP_B] }
              value: { type: string }
              status: { type: string, enum: [CONSISTENT, DIFF, MISSING] }
        consistencyRate: { type: integer, minimum: 0, maximum: 100 }
    GeoIssue:
      type: object
      required: [id, dimensionKey, code, title, severity, channel, fieldKey, currentValue, recommendedValue, status]
      properties:
        id: { type: string }
        dimensionKey: { type: string }
        code: { type: string }
        title: { type: string }
        severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
        channel: { type: string }
        fieldKey: { type: string }
        currentValue: { type: string }
        recommendedValue: { type: string }
        status: { type: string, enum: [OPEN, FIX_PROPOSED, APPROVED, PUBLISHED, DISMISSED] }
    GeoContentPlan:
      type: object
      required: [id, version, questionTerms, scenarioTerms, items, status, modelVersion, approvedBy, approvedAt, createdAt]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        questionTerms: { type: array, items: { type: string } }
        scenarioTerms: { type: array, items: { type: string } }
        items:
          type: array
          items:
            type: object
            required: [title, format, channel, evidenceFactKeys]
            properties:
              title: { type: string }
              format: { type: string }
              channel: { type: string }
              evidenceFactKeys: { type: array, minItems: 1, items: { type: string } }
        status: { type: string, enum: [GENERATED, APPROVED, PUBLISHED] }
        modelVersion: { type: string }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    GeoObservation:
      type: object
      required: [date, channel, mentions, visits, inquiries, orders, attributionModel]
      properties:
        date: { type: string, format: date }
        channel: { type: string }
        mentions: { type: integer, minimum: 0 }
        visits: { type: integer, minimum: 0 }
        inquiries: { type: integer, minimum: 0 }
        orders: { type: integer, minimum: 0 }
        attributionModel: { type: string }
    GeoWorkspace:
      type: object
      required: [id, projectId, leadId, merchantName, status, score, previousScore, scanVersion, nextAction, complianceNotice, version, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        leadId: { type: string }
        merchantName: { type: string }
        status: { type: string, enum: [PENDING, SCANNING, ISSUE_FOUND, FIX_PROPOSED, MERCHANT_APPROVAL, PUBLISHED, MONITORING] }
        score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        previousScore: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        scanVersion: { type: integer, minimum: 0 }
        nextAction: { type: string }
        complianceNotice: { type: string }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    GeoOverview:
      type: object
      required: [counts, eligibleProjects, workspaces, focusWorkspace, dimensions, identity, facts, channelComparisons, issues, contentPlan, observations, cityBenchmark, events, updatedAt]
      properties:
        counts:
          type: object
          required: [total, scanning, issues, awaitingMerchant, monitoring]
          properties:
            total: { type: integer }
            scanning: { type: integer }
            issues: { type: integer }
            awaitingMerchant: { type: integer }
            monitoring: { type: integer }
        eligibleProjects: { type: array, items: { $ref: '#/components/schemas/MiniAppProject' } }
        workspaces: { type: array, items: { $ref: '#/components/schemas/GeoWorkspace' } }
        focusWorkspace:
          anyOf: [{ $ref: '#/components/schemas/GeoWorkspace' }, { type: 'null' }]
        dimensions: { type: array, minItems: 9, maxItems: 9, items: { $ref: '#/components/schemas/GeoDimension' } }
        identity:
          anyOf: [{ $ref: '#/components/schemas/GeoIdentity' }, { type: 'null' }]
        facts: { type: array, items: { $ref: '#/components/schemas/GeoFact' } }
        channelComparisons: { type: array, items: { $ref: '#/components/schemas/GeoChannelComparison' } }
        issues: { type: array, items: { $ref: '#/components/schemas/GeoIssue' } }
        contentPlan:
          anyOf: [{ $ref: '#/components/schemas/GeoContentPlan' }, { type: 'null' }]
        observations: { type: array, items: { $ref: '#/components/schemas/GeoObservation' } }
        cityBenchmark:
          type: object
          required: [cityName, merchantPercentile, cityAverage, industryAverage]
          properties:
            cityName: { type: string }
            merchantPercentile: { type: integer, minimum: 0, maximum: 100 }
            cityAverage: { type: integer, minimum: 0, maximum: 100 }
            industryAverage: { type: integer, minimum: 0, maximum: 100 }
        events: { type: array, items: { $ref: '#/components/schemas/LeadActivity' } }
        updatedAt: { type: string, format: date-time }
    SkillManifest:
      type: object
      required: [skillId, version, tenantId, merchantId, storeId, name, description, inputSchema, outputSchema, scopes, riskLevel, approvalRequired, timeoutMs, retryMax, idempotencyRequired, slaMs, adapter]
      properties:
        skillId: { type: string }
        version: { type: string }
        tenantId: { type: string }
        merchantId: { type: string }
        storeId: { type: string }
        name: { type: string, enum: [get_menu, find_table, reserve_table] }
        description: { type: string }
        inputSchema: { type: object, additionalProperties: true }
        outputSchema: { type: object, additionalProperties: true }
        scopes: { type: array, minItems: 1, items: { type: string } }
        riskLevel: { type: string, enum: [L0, L1, L2, L3] }
        approvalRequired: { type: boolean }
        timeoutMs: { type: integer, minimum: 1 }
        retryMax: { type: integer, minimum: 0 }
        idempotencyRequired: { type: boolean }
        slaMs: { type: integer, minimum: 1 }
        adapter: { type: string }
    SkillNetworkVersion:
      type: object
      required: [id, skillId, name, version, status, maturity, manifest, schemaHash, certifiedBy, certifiedAt, publishedAt, createdAt]
      properties:
        id: { type: string }
        skillId: { type: string }
        name: { type: string, enum: [get_menu, find_table, reserve_table] }
        version: { type: string }
        status: { type: string, enum: [GENERATED, TESTED, CERT_PENDING, CERTIFIED, GRAY, ONLINE, PAUSED, DEPRECATED] }
        maturity: { type: string, enum: [L1, L2, L3, L4] }
        manifest: { $ref: '#/components/schemas/SkillManifest' }
        schemaHash: { type: string }
        certifiedBy: { type: [string, 'null'] }
        certifiedAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    SkillTestRun:
      type: object
      required: [id, skillVersionId, testType, status, latencyMs, assertionCount, detail, createdAt]
      properties:
        id: { type: string }
        skillVersionId: { type: string }
        testType: { type: string, enum: [INPUT_SCHEMA, OUTPUT_SCHEMA, ADAPTER_CONTRACT, RISK_POLICY] }
        status: { type: string, enum: [PASSED, FAILED] }
        latencyMs: { type: integer, minimum: 0 }
        assertionCount: { type: integer, minimum: 1 }
        detail: { type: string }
        createdAt: { type: string, format: date-time }
    SkillInvocation:
      type: object
      required: [id, skillVersionId, skillName, intent, approvalConfirmed, status, attemptCount, latencyMs, resultValid, result, createdAt]
      properties:
        id: { type: string }
        skillVersionId: { type: string }
        skillName: { type: string, enum: [get_menu, find_table, reserve_table] }
        intent: { type: string }
        approvalConfirmed: { type: boolean }
        status: { type: string, enum: [SUCCEEDED, FAILED, TIMED_OUT] }
        attemptCount: { type: integer, minimum: 1 }
        latencyMs: { type: integer, minimum: 0 }
        resultValid: { type: boolean }
        result: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    SkillSuite:
      type: object
      required: [id, geoWorkspaceId, leadId, merchantName, status, nextAction, version, updatedAt]
      properties:
        id: { type: string }
        geoWorkspaceId: { type: string }
