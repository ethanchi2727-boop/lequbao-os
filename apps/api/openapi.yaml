      security: [{ InternalWorkerBearer: [] }]
      parameters:
        - { name: changeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId]
              properties:
                tenantId: { type: string, format: uuid }
      responses:
        '200': { description: 变更已执行或返回完全相同的已执行结果 }
        '401': { description: 内部任务凭证无效 }
        '409': { description: 未批准或尚未到生效时间 }
  /api/v1/subscription-lifecycle/renewal-previews:
    get:
      operationId: listRenewalPreviews
