      x-required-permission: merchant.intake.confirm
      parameters:
        - { name: opportunityId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quoteId, contractNo, contractAssetId, privacyPolicyVersion]
              properties:
                quoteId: { type: string, format: uuid }
                contractNo: { type: string, minLength: 1, maxLength: 100 }
                contractAssetId: { type: string, format: uuid }
                privacyPolicyVersion: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201': { description: 合同已生成并等待签署 }
        '409': { description: 报价过期、合同材料不安全或状态不允许 }
