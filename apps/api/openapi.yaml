                  required: [kind, title, valueFen, expiresAt, confirmed]
                  properties:
                    kind: { type: string, enum: [COUPON, LEVEL, EXPERIENCE] }
                    title: { type: string, minLength: 2, maxLength: 120 }
                    valueFen: { type: integer, minimum: 0 }
                    expiresAt: { type: string, format: date-time }
                    confirmed: { type: boolean, const: true }
      responses:
        '200': { $ref: '#/components/responses/MerchantMemberOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
