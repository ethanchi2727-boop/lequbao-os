          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiniProgram' }
        '422': { description: AppID 授权已失效 }
        '503': { description: 构建器不可用或产物验证失败 }
  /api/v1/mini-programs/{miniProgramId}/releases/{releaseId}/actions/confirm-preview:
    post:
