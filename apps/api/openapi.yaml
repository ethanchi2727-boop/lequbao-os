      security: [{ EmployeeBearer: [] }]
      x-required-permission: report.value.read
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 续费提醒和结构化经营依据 }
  /api/v1/subscription-lifecycle/renewal-previews/{previewId}:
    get:
      operationId: getRenewalPreview
      summary: 查询续费建议的指标快照、具体问题和到期时间
      security: [{ EmployeeBearer: [] }]
      x-required-permission: report.value.read
      parameters:
        - { name: previewId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 可追溯续费预览 }
        '404': { description: 预览不属于当前租户 }
  /api/v1/subscription-lifecycle/renewal-previews/actions/generate:
    post:
      operationId: generateRenewalPreview
      summary: 从 READY 月度经营报告幂等生成续费预览
      security: [{ EmployeeBearer: [] }]
