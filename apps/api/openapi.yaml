      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.read
      parameters:
        - { name: changeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 订阅变更详情 }
        '404': { description: 变更不属于当前租户 }
  /api/v1/subscription-lifecycle/changes/{changeId}/actions/decide:
    post:
      operationId: decideSubscriptionChange
      summary: MFA 下由非申请人批准或驳回订阅变更
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.confirm
      parameters:
        - { name: changeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reasonCode: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200': { description: 审批决定和不可覆盖审计证据已保存 }
        '409': { description: 同人审批、缺少驳回原因或状态冲突 }
  /api/v1/internal/subscription-lifecycle/changes/{changeId}/actions/apply:
    post:
      operationId: applyApprovedSubscriptionChange
