      x-required-permission: merchant.intake.write
      parameters:
        - { name: opportunityId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                decision: { type: string, enum: [CLEAR, CONFIRMED_DUPLICATE] }
                decisionReasonCode: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200': { description: 重复检查证据及处理结果 }
        '409': { description: 人工覆盖缺少原因或幂等冲突 }
  /api/v1/sales/opportunities/{opportunityId}/quotes:
    post:
      operationId: createSalesQuote
      summary: 基于当前有效套餐价格创建限时报价
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.write
      parameters:
        - { name: opportunityId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [planCode, validUntil]
              properties:
                planCode: { type: string, minLength: 1, maxLength: 80 }
                quotedPriceCents: { type: integer, minimum: 0 }
                discountReason: { type: string, minLength: 2, maxLength: 200 }
                addonSnapshot: { type: array, items: { type: object, additionalProperties: true } }
                validUntil: { type: string, format: date-time }
      responses:
        '201': { description: 报价已按套餐价格快照签发 }
        '409': { description: 商机、套餐、价格或有效期状态不允许 }
