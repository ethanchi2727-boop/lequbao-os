      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: messageId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 180 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
