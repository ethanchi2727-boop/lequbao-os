            rating: { type: number, minimum: 0, maximum: 5 }
            reviewCount: { type: integer, minimum: 0 }
            badges: { type: array, items: { type: string } }
            tags: { type: array, items: { type: string } }
            recommendationReason: { type: string }
            coordinates:
              oneOf:
                - type: 'null'
                - type: object
                  additionalProperties: false
                  required: [latitude, longitude, source, confidence]
                  properties:
                    latitude: { type: number, minimum: -90, maximum: 90 }
                    longitude: { type: number, minimum: -180, maximum: 180 }
                    source: { type: string }
                    confidence: { type: number, minimum: 0, maximum: 1 }
        offers:
          type: array
          items: { $ref: '#/components/schemas/ConsumerStoreOffer' }
        latestDraft:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConsumerDealDraft'
        policy:
          type: object
          additionalProperties: false
          required: [version, selfScopeEnforced, publishedStoreRequired, platformDisplayAuthorizationRequired, activeCatalogRequired, livePriceAndStockRequired, explicitConfirmationRequired, draftDoesNotCreateOrder, draftDoesNotCharge]
          properties:
            version: { type: string, const: consumer-store-detail-policy-v1 }
            selfScopeEnforced: { type: boolean, const: true }
            publishedStoreRequired: { type: boolean, const: true }
            platformDisplayAuthorizationRequired: { type: boolean, const: true }
            activeCatalogRequired: { type: boolean, const: true }
            livePriceAndStockRequired: { type: boolean, const: true }
            explicitConfirmationRequired: { type: boolean, const: true }
            draftDoesNotCreateOrder: { type: boolean, const: true }
            draftDoesNotCharge: { type: boolean, const: true }
        updatedAt: { type: string, format: date-time }
    ConsumerAssistantMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    ConsumerAssistantRecommendation:
      type: object
      required: [storeId, merchantId, merchantName, category, distanceMeters, reason, priceFen, address, actionTarget, reservationSupported]
      properties:
        storeId: { type: string }
        merchantId: { type: string }
        merchantName: { type: string }
        category: { type: string }
        distanceMeters: { type: integer, minimum: 0 }
        reason: { type: string }
        priceFen: { type: [integer, 'null'], minimum: 0 }
        address: { type: string }
        actionTarget: { type: string }
        reservationSupported: { type: boolean }
    ConsumerPayment:
      type: object
      required: [intentId, provider, currency, status, version, totalAmountFen, paidAmountFen, refundAmountFen, canPrepare, canRequestRefund, liveConnectorAvailable, disclosure]
      properties:
        intentId: { type: [string, 'null'], format: uuid }
        provider: { type: string, const: WECHAT_PAY }
        currency: { type: string, const: CNY }
        status: { type: string, enum: [NOT_STARTED, PENDING_PROVIDER, SUCCEEDED, FAILED, REFUND_REQUESTED, REFUNDED] }
        version: { type: [integer, 'null'], minimum: 1 }
        totalAmountFen: { type: integer, minimum: 0 }
        paidAmountFen: { type: integer, minimum: 0 }
        refundAmountFen: { type: integer, minimum: 0 }
        canPrepare: { type: boolean }
        canRequestRefund: { type: boolean }
        liveConnectorAvailable: { type: boolean, const: false }
        disclosure: { type: string }
    ConsumerVoiceInput:
      type: object
      required: [id, status, version, fileName, mimeType, byteSize, durationMs, transcript, confidence, failureCode, canConfirm, canSend, liveConnectorAvailable, disclosure, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING_TRANSCRIPTION, READY_FOR_CONFIRMATION, CONFIRMED, DISPATCHED, FAILED]
        version: { type: integer, minimum: 1 }
        fileName: { type: string }
        mimeType:
          type: string
          enum: [audio/mpeg, audio/mp4, audio/wav, audio/x-wav, audio/webm, audio/ogg]
        byteSize: { type: integer, minimum: 1, maximum: 8388608 }
        durationMs: { type: integer, minimum: 500, maximum: 60000 }
        transcript: { type: [string, 'null'], maxLength: 600 }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        failureCode: { type: [string, 'null'] }
        canConfirm: { type: boolean }
        canSend: { type: boolean }
        liveConnectorAvailable: { type: boolean, const: false }
        disclosure: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConsumerImageInput:
      type: object
      required: [id, status, version, fileName, mimeType, byteSize, width, height, category, description, confidence, containsSensitiveData, failureCode, canConfirm, canSend, liveConnectorAvailable, disclosure, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING_RECOGNITION, READY_FOR_CONFIRMATION, CONFIRMED, DISPATCHED, FAILED]
        version: { type: integer, minimum: 1 }
        fileName: { type: string }
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        byteSize: { type: integer, minimum: 1, maximum: 8388608 }
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
        category:
          type: [string, 'null']
          enum: [MENU, PRODUCT, RECEIPT, ENVIRONMENT, OTHER, null]
        description: { type: [string, 'null'], maxLength: 600 }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        containsSensitiveData: { type: [boolean, 'null'] }
        failureCode: { type: [string, 'null'] }
        canConfirm: { type: boolean }
        canSend: { type: boolean }
        liveConnectorAvailable: { type: boolean, const: false }
        disclosure: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConsumerReservationDraft:
      type: object
      required: [id, status, version, storeId, merchantId, merchantName, itemSummary, partySize, reservationAt, customerName, customerPhoneMasked, amountFen, orderId, orderStatus, payment, canEdit, canCancel, merchantReply, confirmationNotice, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [WAITING_CONFIRMATION, CONFIRMED] }
        version: { type: integer, minimum: 1 }
        storeId: { type: string }
        merchantId: { type: string }
        merchantName: { type: string }
        itemSummary: { type: string }
        partySize: { type: integer, minimum: 1, maximum: 20 }
        reservationAt: { type: string, format: date-time }
        customerName: { type: string }
        customerPhoneMasked: { type: string }
        amountFen: { type: integer, minimum: 0 }
        orderId: { type: [string, 'null'] }
        orderStatus:
          type: [string, 'null']
          enum: [PENDING_CONFIRMATION, CONFIRMED, READY_FOR_SERVICE, VERIFIED, COMPLETED, REFUND_REQUESTED, REFUNDED, CANCELLED, EXCEPTION, null]
        payment: { $ref: '#/components/schemas/ConsumerPayment' }
        canEdit: { type: boolean }
        canCancel: { type: boolean }
        merchantReply: { type: [string, 'null'] }
        confirmationNotice: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConsumerAssistantOverview:
      type: object
      required: [session, messages, recommendations, voiceInput, imageInput, reservationDraft, policy, updatedAt]
      properties:
        session:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, version, city, activeMember]
              properties:
                id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
                city: { $ref: '#/components/schemas/ConsumerCity' }
                activeMember: { $ref: '#/components/schemas/ConsumerHouseholdMember' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ConsumerAssistantMessage' }
        recommendations:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ConsumerAssistantRecommendation' }
        voiceInput:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConsumerVoiceInput'
        imageInput:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConsumerImageInput'
        reservationDraft:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConsumerReservationDraft'
        policy:
          type: object
          required: [version, modelVersion, textOnly, voiceInputEnabled, liveTranscriptionConnectorAvailable, transcriptionCallbackSignatureRequired, explicitTranscriptConfirmationRequired, rawAudioDeletedAfterCallback, imageInputEnabled, liveImageRecognitionConnectorAvailable, imageRecognitionCallbackSignatureRequired, explicitImageDescriptionConfirmationRequired, rawImageDeletedAfterCallback, imageMagicAndDimensionValidation, maximumRecommendations, selfScopeEnforced, publishedStoresOnly, explicitConfirmationRequiredForReservation, draftEditableBeforeSubmission, merchantConfirmationReceipt, zeroPaymentCancellationBeforeService, paymentConnectorBoundary, livePaymentConnectorAvailable, providerCallbackSignatureRequired, refundRequiresMerchantApproval]
          properties:
            version: { type: string, const: consumer-assistant-policy-v1 }
            modelVersion: { type: string, const: consumer-intent-local-v1 }
            textOnly: { type: boolean, const: false }
            voiceInputEnabled: { type: boolean, const: true }
            liveTranscriptionConnectorAvailable: { type: boolean, const: false }
            transcriptionCallbackSignatureRequired: { type: boolean, const: true }
            explicitTranscriptConfirmationRequired: { type: boolean, const: true }
            rawAudioDeletedAfterCallback: { type: boolean, const: true }
            imageInputEnabled: { type: boolean, const: true }
            liveImageRecognitionConnectorAvailable: { type: boolean, const: false }
            imageRecognitionCallbackSignatureRequired: { type: boolean, const: true }
            explicitImageDescriptionConfirmationRequired: { type: boolean, const: true }
            rawImageDeletedAfterCallback: { type: boolean, const: true }
            imageMagicAndDimensionValidation: { type: boolean, const: true }
            maximumRecommendations: { type: integer, const: 3 }
            selfScopeEnforced: { type: boolean, const: true }
            publishedStoresOnly: { type: boolean, const: true }
            explicitConfirmationRequiredForReservation: { type: boolean, const: true }
            draftEditableBeforeSubmission: { type: boolean, const: true }
            merchantConfirmationReceipt: { type: boolean, const: true }
            zeroPaymentCancellationBeforeService: { type: boolean, const: true }
            paymentConnectorBoundary: { type: boolean, const: true }
            livePaymentConnectorAvailable: { type: boolean, const: false }
            providerCallbackSignatureRequired: { type: boolean, const: true }
            refundRequiresMerchantApproval: { type: boolean, const: true }
        updatedAt: { type: string, format: date-time }
    ExperienceSnapshot:
      type: object
      required: [runId, completedSteps, totalSteps, completionRate, updatedAt]
      properties:
        runId: { type: string, format: uuid }
        completedSteps: { type: integer }
        totalSteps: { type: integer }
        completionRate: { type: integer }
        updatedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
  responses:
    MerchantMemberOverview:
      description: 更新后的会员分层、画像、权益和召回计划
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MerchantMemberOverview' }
    MerchantCatalogOverview:
      description: 更新后的经营宝商品目录、库存、预约时段与导入状态
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MerchantCatalogOverview' }
    MerchantOperationsOverview:
      description: 更新后的经营宝今日指标、履约队列与经营分析
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MerchantOperationsOverview' }
    SkillNetworkOverview:
      description: 更新后的 Skill Network 工作台
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SkillNetworkOverview' }
    GeoOverview:
      description: 更新后的 GEO OS 工作台
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GeoOverview' }
    MiniAppFactoryOverview:
      description: 更新后的 MiniApp Factory 工作台
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MiniAppFactoryOverview' }
    OnboardingOverview:
      description: 更新后的入网工作台
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnboardingOverview'
    Problem:
      description: RFC Problem Details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
