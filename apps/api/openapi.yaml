                subscriptionId: { type: string, format: uuid }
                reportMonth: { type: string, format: date }
      responses:
        '201': { description: 结构化续费预览已生成 }
        '409': { description: 订阅不可续费或月度报告尚未就绪 }
  /api/v1/subscription-lifecycle/renewal-previews/{previewId}/actions/change-status:
    post:
      operationId: updateRenewalPreviewStatus
      summary: 记录已联系、接受或拒绝续费建议
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.write
      parameters:
        - { name: previewId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [CONTACTED, ACCEPTED, DECLINED] }
      responses:
        '200': { description: 续费联系状态已更新 }
        '409': { description: 预览已经终态或幂等冲突 }
  /api/v1/organization/members:
    get:
      operationId: listOrganizationMembers
      summary: 查询当前租户员工及有效角色分配
      security: [{ EmployeeBearer: [] }]
      x-required-permission: member.manage
      responses:
        '200': { description: 不含手机或邮箱哈希的员工与角色列表 }
  /api/v1/organization/authorization-catalog:
    get:
      operationId: getOrganizationAuthorizationCatalog
      summary: 查询冻结角色、权限、风险级别和授权范围
      security: [{ EmployeeBearer: [] }]
      x-required-permission: role.manage
      responses:
        '200': { description: 角色与权限目录 }
        '403': { description: 需要商户负责人权限和 MFA }
  /api/v1/organization/role-assignments:
    post:
      operationId: assignOrganizationRole
      summary: 幂等分配租户或门店角色并写审计
      security: [{ EmployeeBearer: [] }]
      x-required-permission: role.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: 角色分配已创建或更新 }
        '409': { description: 幂等冲突或成员状态不允许 }
  /api/v1/organization/role-assignments/{assignmentId}/actions/revoke:
    post:
      operationId: revokeOrganizationRole
      summary: 幂等撤销角色且禁止移除最后一个商户负责人
      security: [{ EmployeeBearer: [] }]
      x-required-permission: role.manage
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: 角色已撤销并保留审计证据 }
        '409': { description: 最后负责人保护或幂等冲突 }
  /api/v1/organization/members/{userId}/actions/change-status:
    post:
      operationId: changeOrganizationMemberStatus
      summary: 启用或停用成员，停用时立即撤销其会话
      security: [{ EmployeeBearer: [] }]
      x-required-permission: member.manage
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: 成员状态已更新 }
        '409': { description: 自我停用或最后负责人保护 }
  /api/v1/organization/audit-logs:
    get:
      operationId: listOrganizationAuditLogs
      summary: 查询当前租户脱敏审计元数据
      security: [{ EmployeeBearer: [] }]
      x-required-permission: audit.read
      responses:
        '200': { description: 不返回前后敏感载荷的审计元数据 }
  /api/v1/organization/privacy-requests:
    get:
      operationId: listOrganizationPrivacyRequests
      summary: 查询消费者数据导出、限制和删除请求进度
      security: [{ EmployeeBearer: [] }]
      x-required-permission: customer_profile.export
      responses:
        '200': { description: 当前租户隐私请求及法定保留状态 }
  /api/v1/organization/notifications:
    get:
      operationId: listOrganizationNotifications
      summary: 查询员工授权门店范围内的内部客服通知
      security: [{ EmployeeBearer: [] }]
      x-required-permission: customer_service.read
      responses:
        '200': { description: 内部通知投递状态和脱敏摘要 }
  /api/v1/merchant-operations/profile:
    get:
      operationId: getMerchantOperationsProfile
      summary: 员工读取当前租户安全商户主档
      description: 不返回联系人密文、证照对象键或支付密钥；租户和权限由实时员工会话确定。
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant_profile.manage
      responses:
        '200': { description: 已脱敏商户主体、行业、区域、验证状态和版本 }
        '404': { description: 当前租户无可见商户主档 }
  /api/v1/merchant-operations/stores:
    get:
      operationId: listMerchantOperationsStores
      summary: 查询当前员工获授权门店
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant_profile.manage
      responses:
        '200': { description: 仅返回授权门店的公开运营字段，不返回地址和电话密文 }
  /api/v1/merchant-operations/products:
    get:
      operationId: listMerchantOperationsProducts
      summary: 查询商品、团购及服务库存摘要
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant_profile.manage
      parameters:
        - { name: storeId, in: query, schema: { type: string, format: uuid } }
        - {
            name: productType,
            in: query,
            schema: { type: string, enum: [PHYSICAL, SERVICE, GROUP_BUY, DIGITAL_SUPPLY] },
          }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 商品快照、变体数及库存可售摘要 }
        '404': { description: 请求门店不在员工授权范围 }
  /api/v1/merchant-operations/products/{productId}/actions/publish:
    post:
      operationId: publishMerchantOperationsGroupBuy
      summary: MFA 下确认发布当前授权门店的团购活动
      description: 按期望版本锁定团购，重新检查门店、价格、有效规格和可售库存；幂等回执不可修改。
      security: [{ EmployeeBearer: [] }]
      x-required-permission: order.manage
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 255 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, confirmed]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                confirmed: { type: boolean, const: true }
      responses:
        '200': { description: 活动已上架，或返回完全相同请求的幂等结果 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 员工会话或 MFA 无效 }
        '403': { description: 缺少 order.manage 权限 }
        '404': { description: 团购不存在或不属于授权门店 }
        '409': { description: 幂等冲突、版本变化或发布前置条件不满足 }
  /api/v1/merchant-operations/orders:
    get:
      operationId: listMerchantOperationsOrders
      summary: 员工按授权门店查询订单
      security: [{ EmployeeBearer: [] }]
      x-required-permission: order.read
      parameters:
        - { name: storeId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 不含顾客隐私正文的订单金额和状态摘要 }
  /api/v1/merchant-operations/orders/{orderId}:
    get:
      operationId: getMerchantOperationsOrder
      summary: 员工查看授权门店订单、商品快照与退款
      security: [{ EmployeeBearer: [] }]
      x-required-permission: order.read
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 订单、商品行快照和退款处理状态 }
        '404': { description: 订单不存在或不属于授权门店 }
  /api/v1/merchant-operations/refunds:
    get:
      operationId: listMerchantOperationsRefunds
      summary: 员工查看授权门店退款与审批状态
      security: [{ EmployeeBearer: [] }]
      x-required-permission: order.read
      parameters:
        - { name: storeId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 退款金额、原因、状态及双人审批身份 }
  /api/v1/merchant-operations/verification-uses:
    get:
      operationId: listMerchantOperationsVerificationUses
      summary: 员工查询授权门店核销和冲正记录
      security: [{ EmployeeBearer: [] }]
      x-required-permission: order.read
      parameters:
        - { name: storeId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 核销数量、员工、时间及冲正关系 }
  /api/v1/merchant-operations/reconciliations:
    get:
      operationId: listMerchantOperationsReconciliations
      summary: 财务人员查询每日交易对账结果
      security: [{ EmployeeBearer: [] }]
      x-required-permission: finance.reconcile
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 支付、退款、奖励、核销与渠道差异摘要 }
        '403': { description: 需要财务权限和当前 MFA 会话 }
  /api/v1/merchant-operations/customers:
    get:
      operationId: listMerchantOperationCustomers
      summary: 按员工门店授权范围查询脱敏客户运营列表
      security: [{ EmployeeBearer: [] }]
      x-required-permission: customer_service.read
      parameters:
        - { name: storeId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: query, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200': { description: 不含昵称、手机号密文或对象存储引用的客户列表 }
        '403': { description: 客户不在当前员工门店授权范围 }
  /api/v1/merchant-operations/customers/{customerId}:
    get:
      operationId: getMerchantOperationCustomer
      summary: 查询门店范围内客户的脱敏持续档案摘要
      security: [{ EmployeeBearer: [] }]
      x-required-permission: customer_service.read
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 客户状态、同意版本状态及订单和会话计数 }
        '403': { description: 客户不在当前员工门店授权范围 }
  /api/v1/merchant-operations/customers/{customerId}/rewards:
    get:
      operationId: listMerchantOperationCustomerRewards
      summary: 查询门店范围内客户的不可变奖励投影
      security: [{ EmployeeBearer: [] }]
      x-required-permission: customer_service.read
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 奖励发放、核销、冲回和到期投影 }
        '403': { description: 客户不在当前员工门店授权范围 }
  /api/v1/consumer/storefront:
    get:
      operationId: getConsumerStorefront
      summary: 查询消费者会话绑定的营业中门店公开资料，不返回密文字段或对象存储引用
      security: [{ ConsumerBearer: [] }]
      responses:
        '200': { description: 门店名称、地区、坐标、营业时间和更新时间 }
        '401': { description: 消费者会话无效、撤销或过期 }
        '404': { description: 绑定门店不存在或未营业 }
  /api/v1/consumer/membership:
    get:
      operationId: getConsumerMerchantMembership
      summary: 查询当前商户客户的会员事实与不可变消费奖励投影
      description: 不返回昵称、手机号密文或支付余额；可用奖励按当前客户奖励账户的未过期账本分录计算，并与支付资金隔离。
      security: [{ ConsumerBearer: [] }]
      responses:
        '200': { description: 会员状态、加入时间、奖励账户状态、可用奖励和最近奖励批次 }
        '401': { description: 消费者会话无效、撤销、过期或客户不存在 }
  /api/v1/consumer/stores:
    get:
      operationId: listConsumerMerchantStores
      summary: 列出当前商户租户内可切换的营业中门店并标记当前门店
      security: [{ ConsumerBearer: [] }]
      responses:
        '200': { description: 仅当前商户的营业中门店公开摘要 }
        '401': { description: 消费者会话无效、撤销或过期 }
  /api/v1/consumer/session/actions/switch-store:
    post:
      operationId: switchConsumerMerchantStore
      summary: 原子撤销当前门店会话并签发同到期时间的目标门店会话
      description: 目标门店必须属于当前令牌商户且处于营业状态；相同幂等键可恢复同一次会话轮换，不延长原会话有效期。
      security: [{ ConsumerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId]
              properties:
                storeId: { type: string, format: uuid }
              additionalProperties: false
      responses:
        '200': { description: 目标门店、新消费者访问令牌和不变的到期时间 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 原消费者会话无效、撤销或过期 }
        '404': { description: 目标门店不存在、不属于当前商户或未营业 }
        '409': { description: 幂等重放与目标门店不一致 }
  /api/v1/consumer/products:
    get:
      operationId: listConsumerProducts
      summary: 查询消费者会话绑定门店中真实在售的商品或团购
      security: [{ ConsumerBearer: [] }]
      parameters:
        - name: productType
          in: query
          schema:
            type: string
            enum: [PHYSICAL, SERVICE, GROUP_BUY, DIGITAL_SUPPLY]
        - { name: query, in: query, schema: { type: string, minLength: 1, maxLength: 80 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 10000, default: 0 },
          }
      responses:
        '200': { description: 在售商品、有效规格、真实价格和库存可用性 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 消费者会话无效、撤销或过期 }
  /api/v1/consumer/products/{productId}:
    get:
      operationId: getConsumerProduct
      summary: 查询消费者会话绑定门店中的单个真实在售商品详情
      security: [{ ConsumerBearer: [] }]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 商品类型、价格、版本和有效规格 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 消费者会话无效、撤销或过期 }
        '404': { description: 商品不存在、未上架或不属于绑定门店 }
  /api/v1/consumer/products/{productId}/trace-report:
    get:
      operationId: getConsumerProductTraceReport
      summary: 查询当前门店在售商品的有效已核验溯源报告
      security: [{ ConsumerBearer: [] }]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 版本化摘要、结构化证据、核验时间和有效期 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 消费者会话无效、撤销或过期 }
        '404': { description: 商品或当前有效核验报告不存在 }
  /api/v1/life/cart:
    get:
      operationId: getPlatformConsumerCart
      summary: 查询平台消费者跨商户购物车；按商户和门店分组并重新读取当前价格与库存
      security: [{ LifeConsumerBearer: [] }]
      responses:
        '200': { description: 购物车分组、实时价格、库存可用性和分组小计 }
        '401': { description: 平台消费者会话无效、撤销或过期 }
  /api/v1/life/discovery/stores:
    get:
      operationId: listPlatformConsumerDiscoveryStores
      summary: 查询平台账号已建立客户关系的真实营业门店，并可按本次授权位置计算距离
      description: 服务端从当前平台账号的有效商户客户绑定确定候选租户，逐租户读取公开门店字段。位置仅用于本次距离计算，不写库、不进入日志或画像。
      security: [{ LifeConsumerBearer: [] }]
      parameters:
        - { name: cityCode, in: query, schema: { type: string, minLength: 1, maxLength: 20 } }
        - { name: latitude, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 30 },
          }
      responses:
        '200': { description: 安全门店摘要、在售商品数和可选距离；无绑定时为空数组 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
  /api/v1/merchant-consumer/cart:
    get:
      operationId: getMerchantConsumerCart
      summary: 查询独立商家小程序当前门店购物车；双会话必须映射到同一商户客户
      description: Authorization 携带商家消费者令牌，X-Life-Authorization 携带平台消费者 Bearer 令牌。服务端只返回会话绑定商户与门店的交集，不接受客户端租户范围。
      security: [{ ConsumerBearer: [], LifeConsumerSecondaryBearer: [] }]
      responses:
        '200': { description: 当前商户门店范围内的持久购物车、实时价格与库存 }
        '401': { description: 任一会话失效，或两个会话不属于同一商户客户 }
  /api/v1/merchant-consumer/cart/items:
    put:
      operationId: setMerchantConsumerCartItem
      summary: 在服务端会话确定的商户门店中设置购物车规格数量
      security: [{ ConsumerBearer: [], LifeConsumerSecondaryBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, quantity]
              properties:
                variantId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 999 }
              additionalProperties: false
      responses:
        '200': { description: 已重新校价的当前商户门店购物车 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 双会话无效或身份映射不一致 }
        '409': { description: 商品规格或库存不可用 }
  /api/v1/merchant-consumer/cart/items/{itemId}:
    delete:
      operationId: removeMerchantConsumerCartItem
      summary: 仅删除当前双会话商户门店购物车范围内的项目
      security: [{ ConsumerBearer: [], LifeConsumerSecondaryBearer: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 删除后当前商户门店购物车 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 双会话无效或身份映射不一致 }
        '404': { description: 项目不存在或不属于当前商户门店范围 }
  /api/v1/merchant-consumer/checkouts/quote:
    post:
      operationId: quoteMerchantConsumerCheckout
      summary: 为当前独立商家小程序门店生成服务端校价结算快照
      description: 商户、客户、门店与订单来源均由双会话确定；客户端只能选择商品类型对应的履约方式。
      security: [{ ConsumerBearer: [], LifeConsumerSecondaryBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartVersion]
              properties:
                cartVersion: { type: integer, minimum: 1 }
                fulfillmentChoices:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    required: [productType, orderType]
                    properties:
                      productType: { type: string, enum: [PHYSICAL, GROUP_BUY, SERVICE] }
                      orderType:
                        {
                          type: string,
                          enum: [PHYSICAL_DELIVERY, STORE_PICKUP, GROUP_BUY, SERVICE_APPOINTMENT],
                        }
                      addressId: { type: string, format: uuid }
                    additionalProperties: false
              additionalProperties: false
      responses:
        '201': { description: 来源标记为 MERCHANT_MINI_PROGRAM 的单商户门店结算快照 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 双会话无效或身份映射不一致 }
        '409': { description: 购物车版本或幂等请求冲突 }
        '422': { description: 商品、库存或履约规则不可用 }
  /api/v1/merchant-consumer/checkouts/{checkoutId}:
    get:
      operationId: getMerchantConsumerCheckout
      summary: 查询完全属于当前商户、客户、门店及独立小程序来源的结算快照
      security: [{ ConsumerBearer: [], LifeConsumerSecondaryBearer: [] }]
      parameters:
        - { name: checkoutId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 当前独立商家小程序结算快照 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 双会话无效或身份映射不一致 }
        '404': { description: 快照不存在或含任一范围外分组 }
  /api/v1/merchant-consumer/checkouts/{checkoutId}/actions/submit:
    post:
      operationId: submitMerchantConsumerCheckout
      summary: 幂等创建来源为独立商家小程序的商户直收订单
      security: [{ ConsumerBearer: [], LifeConsumerSecondaryBearer: [] }]
      parameters:
        - { name: checkoutId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: 已创建或可从安全断点重试的订单分组状态 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 双会话无效或身份映射不一致 }
        '404': { description: 快照不存在或不完全属于当前商户门店 }
        '409': { description: 购物车变化或提交幂等冲突 }
        '422': { description: 报价过期、价格库存变化或商户绑定失效 }
  /api/v1/life/addresses:
    get:
      operationId: listPlatformConsumerAddresses
      summary: 查询当前平台消费者自己的有效配送地址；敏感字段仅在鉴权后解密返回
      security: [{ LifeConsumerBearer: [] }]
      responses:
        '200': { description: 默认优先的账号隔离地址列表 }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '503': { description: 地址加密密钥未配置，服务保持关闭 }
    put:
      operationId: savePlatformConsumerAddress
      summary: 新增或更新当前消费者地址；收件人、手机号和街道地址使用 AES-256-GCM 加密落库
      security: [{ LifeConsumerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientName, mobile, provinceCode, cityCode, districtCode, addressLine]
              properties:
                id: { type: string, format: uuid }
                recipientName: { type: string, minLength: 1, maxLength: 80 }
                mobile: { type: string, pattern: '^1[3-9][0-9]{9}$' }
                provinceCode: { type: string, minLength: 1, maxLength: 20 }
                cityCode: { type: string, minLength: 1, maxLength: 20 }
                districtCode: { type: string, minLength: 1, maxLength: 20 }
                addressLine: { type: string, minLength: 1, maxLength: 300 }
                isDefault: { type: boolean, default: false }
              additionalProperties: false
      responses:
        '200': { description: 已保存并解密返回给当前所有者的地址 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 更新目标不存在或不属于当前消费者 }
        '503': { description: 地址加密密钥未配置，服务保持关闭 }
  /api/v1/life/addresses/{addressId}:
    delete:
      operationId: archivePlatformConsumerAddress
      summary: 归档当前消费者自己的地址，不删除历史结算引用
      security: [{ LifeConsumerBearer: [] }]
      parameters:
        - { name: addressId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 地址已归档 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 地址不存在或不属于当前消费者 }
  /api/v1/life/invoice-profiles:
    get:
      operationId: listPlatformConsumerInvoiceProfiles
      summary: 查询当前平台账号自己的有效发票抬头并在鉴权后解密
      security: [{ LifeConsumerBearer: [] }]
      responses:
        '200': { description: 默认优先的个人或企业发票抬头 }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '503': { description: 敏感字段加密密钥未配置，服务保持关闭 }
    put:
      operationId: savePlatformConsumerInvoiceProfile
      summary: 新增或更新本人发票抬头；标题、税号和邮箱使用 AES-256-GCM 加密落库
      security: [{ LifeConsumerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileType, title]
              properties:
                id: { type: string, format: uuid }
                profileType: { type: string, enum: [PERSONAL, ENTERPRISE] }
                title: { type: string, minLength: 1, maxLength: 200 }
                taxIdentifier: { type: string, minLength: 5, maxLength: 80 }
                email: { type: string, format: email, maxLength: 255 }
                isDefault: { type: boolean, default: false }
              additionalProperties: false
      responses:
        '200': { description: 已加密保存并仅向本人解密返回的抬头 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 更新目标不存在或不属于当前账号 }
        '503': { description: 敏感字段加密密钥未配置，服务保持关闭 }
  /api/v1/life/invoice-profiles/{profileId}:
    delete:
      operationId: archivePlatformConsumerInvoiceProfile
      summary: 归档本人发票抬头，不物理删除历史开票引用
      security: [{ LifeConsumerBearer: [] }]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: 发票抬头已归档 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 抬头不存在或不属于当前账号 }
  /api/v1/life/cart/items:
    put:
      operationId: setPlatformConsumerCartItem
      summary: 设置跨商户购物车规格的目标数量；服务端验证账号商户绑定、商品状态和库存
      security: [{ LifeConsumerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantTenantId, storeId, variantId, quantity]
              properties:
                merchantTenantId: { type: string, format: uuid }
                storeId: { type: string, format: uuid }
                variantId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 999 }
              additionalProperties: false
      responses:
        '200': { description: 已按目标数量创建或更新并返回重新校价后的完整购物车 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '409': { description: 商户绑定、商品、门店、规格或库存不可用 }
  /api/v1/life/cart/items/{itemId}:
    delete:
      operationId: removePlatformConsumerCartItem
      summary: 删除当前平台消费者活动购物车中的指定项目
      security: [{ LifeConsumerBearer: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 删除后重新校价的完整购物车 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 项目不存在或不属于当前消费者活动购物车 }
  /api/v1/life/orders:
    get:
      operationId: listPlatformConsumerOrders
      summary: 通过平台消费者已绑定的商户客户档案合并查询跨商户订单
      security: [{ LifeConsumerBearer: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_PAYMENT, PAID, FULFILLING, COMPLETED, CANCELLED, CLOSED]
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 30 },
          }
      responses:
        '200': { description: 按创建时间合并排序的跨商户订单摘要，不接受客户端租户身份 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
  /api/v1/life/checkouts/quote:
    post:
      operationId: quotePlatformConsumerCheckout
      summary: 按当前购物车版本重新核价并按商户、门店和履约类型生成可解释结算快照
      security: [{ LifeConsumerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartVersion]
              properties:
                cartVersion: { type: integer, minimum: 1 }
                fulfillmentChoices:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [merchantTenantId, storeId, productType, orderType]
                    properties:
                      merchantTenantId: { type: string, format: uuid }
                      storeId: { type: string, format: uuid }
                      productType: { type: string, enum: [PHYSICAL, GROUP_BUY, SERVICE] }
                      orderType:
                        type: string
                        enum: [PHYSICAL_DELIVERY, STORE_PICKUP, GROUP_BUY, SERVICE_APPOINTMENT]
                      addressId: { type: string, format: uuid }
                    additionalProperties: false
              additionalProperties: false
      responses:
        '201': { description: 服务端价格、最优有效优惠、配送费、退款摘要及分组应付快照 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '409': { description: 购物车版本变化或幂等键请求体冲突 }
        '422': { description: 商品、库存、履约规则、商户绑定或配送地址不可用 }
  /api/v1/life/checkouts/{checkoutId}:
    get:
      operationId: getPlatformConsumerCheckout
      summary: 查询当前平台消费者自己的结算快照和各商户分组状态
      security: [{ LifeConsumerBearer: [] }]
      parameters:
        - { name: checkoutId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 账号隔离的结算总额、分组定价证据及有效期 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 结算快照不存在或不属于当前消费者 }
  /api/v1/life/checkouts/{checkoutId}/actions/submit:
    post:
      operationId: submitPlatformConsumerCheckout
      summary: 幂等地按结算分组创建商户直收订单；部分失败保留已创建订单并允许从断点重试
      security: [{ LifeConsumerBearer: [] }]
      parameters:
        - { name: checkoutId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: 返回各分组 ORDER_CREATED 或 FAILED 状态；全部成功后关闭原购物车 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 结算快照不存在或不属于当前消费者 }
        '409': { description: 购物车已变化或提交幂等键冲突 }
        '422': { description: 报价过期、价格库存变化或商户绑定失效 }
  /api/v1/life/orders/{orderId}:
    get:
      operationId: getPlatformConsumerOrder
      summary: 仅通过当前平台消费者有效商户绑定查找订单详情
      security: [{ LifeConsumerBearer: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 订单多维状态、金额、门店和下单时商品快照 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 任一有效商户绑定下均不存在该订单 }
  /api/v1/life/orders/{orderId}/aftercare:
    get:
      operationId: getPlatformConsumerOrderAftercare
      summary: 查询当前平台消费者订单的退款申请、审批与提供方进度真相
      security: [{ LifeConsumerBearer: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 服务端持久化的退款记录、退款项目金额与审批状态 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 任一有效商户绑定下均不存在该乐趣生活订单 }
  /api/v1/life/orders/{orderId}/refunds:
    post:
      operationId: requestPlatformConsumerRefund
      summary: 服务端反查订单商户、客户和门店范围后申请退款
      security: [{ LifeConsumerBearer: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCommerceRefund' }
      responses:
        '202':
          description: 退款申请已按原订单已付分摊和剩余可退数量创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommerceRefund' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 任一有效商户绑定下均不存在该乐趣生活订单 }
        '409': { description: 幂等请求冲突或订单、核销及剩余可退范围不允许申请 }
        '503': { description: 退款提供方适配器未配置 }
  /api/v1/life/orders/{orderId}/verification-entitlements:
