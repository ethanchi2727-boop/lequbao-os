              properties:
                statementId: { type: string, format: uuid }
                costEntryId: { type: string, format: uuid }
                disputeType: { type: string, enum: [COST, REVENUE] }
                reasonCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,79}$' }
                description: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201': { description: 已提交且可幂等重放的申诉 }
        '404': { description: 分配单或成本不属于当前授权范围 }
