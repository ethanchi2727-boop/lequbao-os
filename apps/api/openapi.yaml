        '200': { description: 收益权转让列表 }
  /api/v1/sales/opportunities:
    get:
      operationId: listSalesOpportunities
      summary: 查询本人负责或授权范围内的商机
      description: 响应不返回统一信用代码、手机、地址及其匹配哈希。
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.read
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 当前授权范围的商机摘要 }
    post:
      operationId: createSalesOpportunity
      summary: 从已通过安全处理的建档材料创建商机
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.create
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalSubjectName, evidenceAssetId, firstContactAt, nextAction]
              anyOf:
                - { required: [unifiedCreditCode] }
                - { required: [contactMobile] }
                - { required: [storeAddress] }
              properties:
                legalSubjectName: { type: string, minLength: 2, maxLength: 200 }
                unifiedCreditCode: { type: string, minLength: 8, maxLength: 40 }
                contactMobile: { type: string, minLength: 6, maxLength: 30 }
                storeAddress: { type: string, minLength: 4, maxLength: 500 }
                evidenceAssetId: { type: string, format: uuid }
                firstContactAt: { type: string, format: date-time }
                nextAction: { type: string, minLength: 2, maxLength: 500 }
                protectionDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        '201': { description: 商机已创建；稳定标识仅以服务端 HMAC 保存 }
        '409': { description: 材料未通过安全处理或幂等冲突 }
