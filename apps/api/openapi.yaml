      x-required-permission: revenue_right.transfer_approve
      parameters:
        - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 原受益人结束且新受益人生效，总份额仍为 7000 基点 }
        '403': { description: 无审批权限 }
        '409': { description: 缺少双方确认、同人审批或状态冲突 }
  /api/v1/revenue-right-groups/{rightGroupId}/disputes:
    post:
      operationId: openRevenueRightDispute
      summary: 对重复主张的永久收益权开立争议并暂停相关应付
      security: [{ EmployeeBearer: [] }]
      x-required-permission: revenue_right.suspend
      parameters:
        - { name: rightGroupId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimantBeneficiaryIds, reasonCode]
              properties:
                claimantBeneficiaryIds:
                  type: array
                  minItems: 2
                  items: { type: string, format: uuid }
                reasonCode: { type: string, minLength: 1, maxLength: 80 }
                evidence: { type: object, additionalProperties: true }
      responses:
        '202': { description: 收益权进入争议状态并暂停锁定新应付 }
        '403': { description: 无暂停权限 }
        '409': { description: 已有争议、状态或幂等冲突 }
  /api/v1/merchant-intake/sessions:
    post:
      operationId: createMerchantIntakeSession
      summary: 使用签名会话身份开始统一商户资料对话
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.create
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMerchantIntakeSession' }
      responses:
        '201':
          description: 会话已创建，操作者与租户来自签名令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantIntakeSession' }
        '401': { description: 会话令牌缺失、失效或签名错误 }
        '403': { description: 当前角色无建档权限或已被撤销 }
        '409': { description: 幂等冲突 }
  /api/v1/merchant-intake/sessions/{sessionId}:
    get:
      operationId: getMerchantIntakeSession
      summary: 查看带原材料来源、冲突和确认状态的建档会话
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.read
      parameters: [{ $ref: '#/components/parameters/IntakeSessionId' }]
      responses:
        '200':
          description: 当前租户可见的建档会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantIntakeSession' }
        '401': { description: 会话令牌无效 }
        '403': { description: 无读取权限 }
        '409': { description: 会话不存在或状态无效 }
  /api/v1/merchant-intake/sessions/{sessionId}/uploads:
    post:
      operationId: createMerchantIntakeUpload
      summary: 申请受租户、摘要、类型、大小和时效约束的对象上传授权
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.write
      parameters:
        - $ref: '#/components/parameters/IntakeSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMerchantIntakeUpload' }
      responses:
        '201':
          description: 返回十五分钟有效的签名 PUT 授权
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantIntakeUploadAuthorization' }
        '401': { description: 会话令牌无效 }
        '403': { description: 无写入权限 }
        '409': { description: 状态或幂等冲突 }
  /api/v1/merchant-intake/uploads/{uploadId}/actions/complete:
    post:
      operationId: completeMerchantIntakeUpload
      summary: 用对象存储侧摘要、类型和长度证据消费上传票据
      description: 只有校验完全一致的对象才会登记为原材料并进入安全扫描队列。
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.write
      parameters:
        - $ref: '#/components/parameters/IntakeUploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 票据已原子消费，原材料等待安全扫描
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantIntakeUploadCompletion' }
        '401': { description: 会话令牌无效 }
        '403': { description: 无写入权限 }
        '409': { description: 票据已消费、已过期、会话状态或幂等冲突 }
        '422': { description: 对象存储证据与授权不一致 }
        '503': { description: 对象存储证据服务暂不可用 }
  /api/v1/merchant-intake/sessions/{sessionId}/messages:
    post:
      operationId: addMerchantIntakeMessage
      summary: 保存文字补充材料并进入统一安全处理链
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.write
      parameters:
        - $ref: '#/components/parameters/IntakeSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMerchantIntakeMessage' }
      responses:
        '202':
          description: 文字原文已持久保存并登记为可追溯原材料
        '401': { description: 会话令牌无效 }
        '403': { description: 无写入权限 }
        '409': { description: 会话状态或幂等冲突 }
  /api/v1/merchant-intake/sessions/{sessionId}/confirmations:
    post:
      operationId: confirmMerchantIntakeFields
      summary: 由商户负责人逐类确认法律主体及其他高风险候选
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.confirm
      parameters:
        - $ref: '#/components/parameters/IntakeSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmMerchantIntakeFields' }
      responses:
        '200':
          description: 确认记录与候选来源已不可变保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantIntakeSession' }
        '401': { description: 会话令牌无效 }
        '403': { description: 不是可确认的负责人或角色已撤销 }
        '409': { description: 乐观版本或幂等冲突 }
        '422': { description: 确认类型与候选不匹配 }
  /api/v1/merchant-intake/sessions/{sessionId}/actions/commit:
    post:
      operationId: commitMerchantIntakeSession
      summary: 将已确认且无冲突的候选提交为正式商户档案
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant.intake.confirm
      parameters:
        - $ref: '#/components/parameters/IntakeSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitMerchantIntakeSession' }
      responses:
        '200':
          description: 正式档案、不可变提交快照、审计与 Outbox 已原子提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantIntakeCommitResult' }
        '401': { description: 会话令牌无效 }
        '403': { description: 无确认权限 }
        '409': { description: 乐观版本、状态或幂等冲突 }
        '422': { description: 存在未确认、冲突或缺失的正式字段 }
  /api/v1/webhooks/wecom/intake:
    post:
      operationId: receiveWeComIntakeCallback
      summary: 企业微信内部应用加密消息回调
      description: 校验 SHA-1 消息签名、时间窗、AES-CBC 密文和企业 ID 后，按 MsgId 与密文摘要去重；不接收消费者私聊。
      security: []
      parameters:
        - { name: msg_signature, in: query, required: true, schema: { type: string } }
        - { name: timestamp, in: query, required: true, schema: { type: string } }
        - { name: nonce, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/xml:
            schema: { type: string }
      responses:
        '200': { description: 已验签、解密、去重并进入统一建档链 }
        '400': { description: 回调参数或 XML 无效 }
        '401': { description: 签名、时间窗、密文或企业 ID 无效 }
        '409': { description: 相同 MsgId 对应不同密文 }
  /api/v1/customer-service/conversations:
    post:
      operationId: createCustomerServiceConversation
      summary: 消费者在商家小程序内建立自研在线客服会话
      description: 独立消费者令牌确定租户、顾客和门店；服务同意与可选持续档案同意分开记录。
      security: [{ ConsumerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerServiceConversationRequest' }
      responses:
        '201':
          description: 会话和不可抵赖的服务同意已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerServiceConversation' }
        '401': { description: 消费者会话无效、过期或已撤销 }
    get:
      operationId: listCustomerServiceConversations
      summary: 消费者查询本人当前门店会话，或员工查询授权门店转人工队列
      security: [{ ConsumerBearer: [] }, { EmployeeBearer: [] }]
      description: 消费者分支忽略 status 并固定 customer_id/store_id；员工分支要求 customer_service.read 并执行门店范围校验。
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [HUMAN_QUEUED, HUMAN_ACTIVE, WAITING_CUSTOMER, CLOSED] }
      responses:
        '200':
          description: 仅返回本人当前门店会话，或员工租户/被分配门店范围内的会话
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerServiceConversation' }
  /api/v1/customer-service/conversations/{conversationId}:
    get:
      operationId: getCustomerServiceConversation
      summary: 消费者查看本人会话，或员工查看授权门店会话
      security: [{ ConsumerBearer: [] }, { EmployeeBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ConversationId' }]
      responses:
        '200':
          description: 会话、人工工单和真实接管员工状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerServiceConversation' }
        '404': { description: 会话不属于当前消费者或员工数据范围 }
  /api/v1/customer-service/conversations/{conversationId}/messages:
    get:
      operationId: listCustomerServiceMessages
      summary: 查询本人或授权门店会话的脱敏消息元数据
      security: [{ ConsumerBearer: [] }, { EmployeeBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ConversationId' }]
      responses:
        '200':
          description: 消息按持久化顺序返回
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerServiceMessage' }
    post:
      operationId: sendCustomerServiceMessage
      summary: 客户或当前接管员工发送消息
      description: 服务端根据令牌受众确定发送者；忽略客户端 sender_type 和 sender_user_id。消息正文先写对象存储，再返回 messageId。
      security: [{ ConsumerBearer: [] }, { EmployeeBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendCustomerServiceMessageRequest' }
      responses:
        '201':
          description: 消息已持久化；AI 处理通过耐久作业异步执行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerServiceMessage' }
        '409': { description: 幂等冲突、会话已关闭或人工接管冲突 }
  /api/v1/customer-service/conversations/{conversationId}/messages/{messageId}/content:
    get:
      operationId: getCustomerServiceMessageContent
      summary: 消费者或授权员工读取单条会话正文
      description: 每次重新校验消费者归属或员工门店范围；员工正文读取单独写入审计日志，对象存储引用不转成公开地址。
      security: [{ ConsumerBearer: [] }, { EmployeeBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 经完整性校验的单条正文
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [content]
                properties:
                  content: { type: string }
        '403': { description: 消息不属于本人会话或授权门店 }
  /api/v1/customer-service/conversations/{conversationId}/actions/request-human:
    post:
      operationId: requestCustomerServiceHumanHandoff
      summary: 消费者显式请求人工
      security: [{ ConsumerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCustomerServiceHumanRequest' }
      responses:
        '202':
          description: 站内队列已可靠创建；企业微信提醒失败不影响工单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerServiceConversation' }
  /api/v1/customer-service/conversations/{conversationId}/actions/accept:
    post:
      operationId: acceptCustomerServiceConversation
      summary: 授权门店员工原子接管，竞争者收到 409
      security: [{ EmployeeBearer: [] }]
      x-required-permission: customer_service.accept
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 工单与会话已绑定真实员工，排队或运行中的 AI 作业已取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerServiceConversation' }
        '409': { description: 已被另一员工接管 }
  /api/v1/customer-service/conversations/{conversationId}/actions/return-to-ai:
    post:
      operationId: returnCustomerServiceConversationToAi
      summary: 仅当前接管员工明确将会话交还 AI
      security: [{ EmployeeBearer: [] }]
      x-required-permission: customer_service.send
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 人工工单已结案，后续新问题可重新由 AI 处理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerServiceConversation' }
  /api/v1/customer-service/conversations/{conversationId}/actions/close:
    post:
      operationId: closeCustomerServiceConversation
      summary: 当前接管员工用解决码关闭会话
      security: [{ EmployeeBearer: [] }]
      x-required-permission: customer_service.close
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseCustomerServiceConversationRequest' }
      responses:
        '200':
          description: 会话和工单已带解决码关闭
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerServiceConversation' }
  /api/v1/customer-profile:
    get:
      operationId: getContinuousCustomerProfile
      summary: 消费者查看本商家范围内的持续客户档案摘要和来源
      security: [{ ConsumerBearer: [] }]
      responses:
        '200': { description: 不含事实正文或对象存储密钥的来源、用途、置信度与到期状态 }
        '401': { description: 消费者会话无效 }
  /api/v1/customer-profile/consents:
    post:
      operationId: changeContinuousCustomerProfileConsent
      summary: 分目的授予或撤回持续档案、营销、订阅消息或位置同意
      security: [{ ConsumerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeCustomerConsentRequest' }
      responses:
        '200':
          description: 撤回持续档案同意后立即停止新增，并创建已有档案处理队列
        '409': { description: 幂等冲突 }
  /api/v1/customer-profile/privacy-requests:
    post:
      operationId: requestContinuousCustomerProfilePrivacyAction
      summary: 消费者申请查看、更正、限制使用或删除持续客户档案
      description: 更正内容写入租户隔离对象存储，数据库和日志只保留摘要；删除与限制请求立即阻止现有事实继续使用，并进入受控隐私队列。
      security: [{ ConsumerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerPrivacyRequest' }
      responses:
        '202':
          description: 隐私请求已可靠排队，法律或交易保留项由隐私 Worker 区分处理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPrivacyRequestReceipt' }
        '403': { description: 更正目标不属于当前消费者或不可更正 }
        '409': { description: 幂等冲突 }
  /api/v1/customer-service/knowledge-publications:
    get:
      operationId: listCustomerServiceKnowledgePublications
      summary: 商户管理员查看授权门店的已审核知识及有效期
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant_profile.manage
      parameters:
        - { name: storeId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 过期知识先收敛为 EXPIRED，再按员工门店范围返回
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KnowledgePublication' }
    post:
      operationId: publishCustomerServiceKnowledge
      summary: 审核并发布一版门店知识供 AI 精确引用
      description: 只允许发布 READY、非个人敏感且属于授权门店的文档；发布版本正文不可修改，更新必须产生新版本。
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant_profile.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishKnowledgeRequest' }
      responses:
        '201':
          description: 不可变知识版本已发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgePublication' }
        '403': { description: 文档不属于授权门店、未就绪或包含个人敏感信息 }
        '409': { description: 同一文档版本已发布或幂等冲突 }
  /api/v1/customer-service/knowledge-publications/{publicationId}/actions/revoke:
    post:
      operationId: revokeCustomerServiceKnowledge
      summary: 撤销一版错误或不再适用的已发布知识
      security: [{ EmployeeBearer: [] }]
      x-required-permission: merchant_profile.manage
      parameters:
        - { name: publicationId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 发布内容保留为审计证据，但从 AI 可用范围撤销
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgePublication' }
        '409': { description: 知识已经过期或撤销 }
  /internal/v1/customer-service/ai-jobs/process:
    post:
      operationId: processCustomerServiceAiJob
      summary: 租户分片 Worker 触发耐久 AI 客服作业
      security: [{ InternalWorkerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessCustomerServiceAiJobRequest' }
      responses:
        '202': { description: 作业已成功、转人工、重试或由并发接管取消 }
        '401': { description: 独立内部 Worker 凭证无效 }
  /api/v1/mini-program-authorizations/actions/activate:
    post:
      operationId: activateMerchantMiniProgramAuthorization
      summary: 用商户负责人一次性授权码换取 AppID 授权并绑定交付项目
      description: 一次性授权码不落库；仅保存服务端密钥引用、授权范围和 AppID 全局归属摘要。
      security: [{ EmployeeBearer: [] }]
      x-required-permission: miniprogram.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateMiniProgramAuthorizationRequest' }
      responses:
        '201':
          description: AppID 授权已激活并归属当前商户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiniProgram' }
        '409': { description: AppID 已归属其他租户或幂等请求冲突 }
