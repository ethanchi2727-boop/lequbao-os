        '200':
          description: 当前消费者的消息分类、未读数和消息列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsumerMessageOverview' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
