        '200':
          description: 仅当前订单所有者可见的短期签名核销凭证
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommerceVerificationToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 任一有效商户绑定下均不存在该乐趣生活订单 }
        '503': { description: 核销签名密钥未配置 }
  /api/v1/life/rewards:
    get:
      operationId: listPlatformConsumerRewards
      summary: 合并当前平台账号有效商户绑定下的奖励账本投影
      security: [{ LifeConsumerBearer: [] }]
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 30 },
          }
      responses:
        '200': { description: 奖励原额、已兑、已冲正、可用额、规则版本和有效期 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
  /api/v1/life/verification-entitlements:
    get:
      operationId: listPlatformConsumerAvailableVerificationEntitlements
      summary: 合并当前平台账号有效商户绑定下尚可使用的核销凭证
      security: [{ LifeConsumerBearer: [] }]
      responses:
        '200':
          description: 仅包含剩余次数大于零且仍可使用的短期签名凭证
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommerceVerificationToken' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '503': { description: 核销签名密钥未配置 }
  /api/v1/verification-entitlements:
    get:
      operationId: listCommerceConsumerAvailableVerificationEntitlements
      summary: 查询当前商家小程序消费者在绑定门店尚可使用的券
      security: [{ ConsumerBearer: [] }]
      responses:
        '200':
          description: 仅当前租户、客户和门店的可用短期签名凭证
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommerceVerificationToken' }
        '401': { description: 商家消费者会话无效、撤销或过期 }
        '503': { description: 核销签名密钥未配置 }
  /api/v1/orders:
    get:
      operationId: listCommerceConsumerOrders
      summary: 查询当前商家独立小程序消费者在绑定门店的订单
      security: [{ ConsumerBearer: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_PAYMENT, PAID, FULFILLING, COMPLETED, CANCELLED, CLOSED]
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 30 },
          }
      responses:
        '200': { description: 仅当前租户、客户和门店的商家小程序订单真相 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 商家消费者会话无效、撤销或过期 }
    post:
      operationId: createCommerceOrder
      summary: 按服务端商品快照锁价并原子预占库存
      security: [{ ConsumerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommerceOrderRequest' }
      responses:
        '201':
          description: 订单与库存预占已原子创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommerceOrder' }
        '409': { description: 库存不足或幂等请求冲突 }
  /api/v1/orders/{orderId}:
    get:
      operationId: getCommerceOrder
      summary: 获取消费者本人或员工授权范围内的订单投影
      security: [{ ConsumerBearer: [] }, { EmployeeBearer: [] }]
      x-required-permission: order.read
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 服务端订单真相
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommerceOrder' }
        '403': { description: 订单不属于当前主体或不在门店范围 }
  /api/v1/payment-intents:
    post:
      operationId: createCommercePaymentIntent
      summary: 使用服务端订单金额和已确认商户收款账户创建支付
      security: [{ ConsumerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommercePaymentRequest' }
      responses:
        '202':
          description: 支付凭证已安全保存并返回；客户端结果不改变支付状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercePaymentIntent' }
        '409': { description: 订单不可支付或支付创建正在恢复 }
  /api/v1/life/payment-intents:
    post:
      operationId: createPlatformConsumerPaymentIntent
      summary: 从平台消费者有效商户绑定解析订单归属，并使用该商户已确认的支付账户创建支付凭证
      security: [{ LifeConsumerBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, provider]
              properties:
                orderId: { type: string, format: uuid }
                provider: { type: string, enum: [WECHAT_PAY, ALIPAY, SANDBOX] }
              additionalProperties: false
      responses:
        '202': { description: 商户直收支付凭证；客户端结果仍需服务端订单状态确认 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 平台消费者会话无效、撤销或过期 }
        '404': { description: 任一有效商户绑定下均不存在该乐趣生活订单 }
        '409': { description: 支付状态或幂等请求冲突 }
        '503': { description: 支付提供方适配器或商户确认账户未配置 }
  /api/v1/webhooks/payments/{provider}:
    post:
      operationId: receiveCommercePaymentCallback
      summary: 对原始回调正文验签并幂等收敛支付或退款终态
      security: []
      parameters:
        - {
            name: provider,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/CommerceProvider' },
          }
        - {
            name: x-payment-signature,
            in: header,
            required: true,
            schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommercePaymentCallback' }
          application/vnd.lequ.payment-callback+json:
            schema: { $ref: '#/components/schemas/CommercePaymentCallback' }
      responses:
        '200': { description: 已应用或已精确应用过 }
        '401': { description: 原始正文签名、提供方或回调主体无效 }
        '409': { description: 同一事件标识出现不同正文或业务状态冲突 }
  /api/v1/orders/{orderId}/refunds:
    get:
      operationId: listCommerceConsumerRefunds
      summary: 查询当前商家消费者订单的退款记录
      security: [{ ConsumerBearer: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 服务端退款记录与项目分摊
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommerceRefund' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 商家消费者会话无效、撤销或过期 }
        '403': { description: 订单不属于当前租户、消费者或门店 }
    post:
      operationId: requestCommerceRefund
      summary: 按原订单已付分摊创建不超范围的售后退款
      security: [{ ConsumerBearer: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCommerceRefund' }
      responses:
        '202':
          description: 退款已创建并根据快照进入审批或待提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommerceRefund' }
        '409': { description: 原单、核销或剩余可退范围不允许本次请求 }
  /api/v1/refunds/{refundId}/actions/approve:
    post:
      operationId: approveCommerceRefund
      summary: 由不同员工在授权门店范围内审批退款
      security: [{ EmployeeBearer: [] }]
      x-required-permission: refund.approve
      x-mfa-required: true
      parameters:
        - { name: refundId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveCommerceRefund' }
      responses:
        '200':
          description: 审批结果与审计证据已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommerceRefund' }
        '409': { description: 自批、重复审批或状态冲突 }
  /api/v1/orders/{orderId}/verification-entitlements:
    get:
      operationId: listCommerceVerificationEntitlements
      summary: 获取消费者本人订单的当前不透明核销凭证
      security: [{ ConsumerBearer: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 当前代次凭证；凭证正文不包含订单明文
          content:
            application/json:
              schema:
                { type: array, items: { $ref: '#/components/schemas/CommerceVerificationToken' } }
  /api/v1/verification-uses:
    post:
      operationId: useCommerceVerification
      summary: 在授权门店按设备风险、有效期和剩余次数原子核销
      security: [{ EmployeeBearer: [] }]
      x-required-permission: verification.execute
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UseCommerceVerification' }
      responses:
        '201':
          description: 核销已落不可变流水并更新履约投影
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommerceVerificationResult' }
        '409': { description: 门店、时间、风险、代次或剩余次数校验失败 }
  /api/v1/commerce-reconciliations:
    post:
      operationId: runCommerceReconciliation
      summary: 核对支付、退款、订单、奖励与核销并对一分钱差异停账
      security: [{ EmployeeBearer: [] }]
      x-required-permission: finance.reconcile
      x-mfa-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunCommerceReconciliation' }
      responses:
        '201':
          description: 不可变日对账批次与差异明细
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommerceReconciliation' }
        '409': { description: 同批次仍在计算或收款账户不可用 }
  /api/v1/internal/commerce/orders/{orderId}/actions/expire:
    post:
      operationId: expireCommerceOrder
      summary: 内部任务幂等释放过期未支付订单的库存
      security: [{ InternalWorkerBearer: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalTenantCommand' }
      responses:
        '200': { description: 已过期或此前已经安全释放 }
        '401': { description: 内部工作令牌无效 }
  /api/v1/internal/commerce/refunds/{refundId}/actions/submit:
    post:
      operationId: submitCommerceRefund
      summary: 内部任务使用唯一提供方尝试提交待处理退款
      security: [{ InternalWorkerBearer: [] }]
      parameters:
        - { name: refundId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalTenantCommand' }
      responses:
        '202': { description: 已提交、处理中或等待提供方查询恢复 }
        '401': { description: 内部工作令牌无效 }
  /api/v1/geo/profiles/{profileId}/actions/publish:
    post:
      operationId: publishGeoProfile
      summary: 将商户确认的统一资料发布到一个已授权目标
      description: 只承诺资料校验、授权提交和证据保存，不承诺第三方收录、排名、流量或成交。
      security: [{ EmployeeBearer: [] }]
      x-required-permission: geo.publish
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: 独立目标的提交状态、证据引用和下次重试时间 }
        '422': { description: 资料不完整或出现禁止承诺 }
  /api/v1/plugins/installations:
    post:
      operationId: installOfficialPlugin
      summary: 负责人逐项确认权限、域名、费用和卸载影响后安装官方插件
      security: [{ EmployeeBearer: [] }]
      x-required-permission: plugin.install
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: 安装完成并生成最小权限授权 }
        '409': { description: 清单、版本或负责人确认不满足要求 }
  /api/v1/plugins/catalog:
    get:
      operationId: listOfficialPlugins
      summary: 查询已审核、已签名并发布的第一方插件目录
      security: [{ EmployeeBearer: [] }]
      x-required-permission: plugin.install
      responses:
        '200': { description: 包含权限、域名、费用、限额和卸载影响的官方插件清单 }
  /api/v1/plugins/catalog/{pluginCode}:
    get:
      operationId: getOfficialPlugin
      summary: 查询一个已发布第一方插件的精确版本、权限、域名、费用和卸载影响
      security: [{ EmployeeBearer: [] }]
      x-required-permission: plugin.install
      parameters:
        - { name: pluginCode, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 可用于明确授权安装的插件版本和完整清单 }
        '404': { description: 插件不存在或未发布 }
  /api/v1/plugins/installations/{installationId}/invocations:
    post:
      operationId: invokeOfficialPlugin
      summary: 使用安装级权限和声明域名调用隔离插件运行时
      security: [{ EmployeeBearer: [] }]
      x-required-permission: plugin.permission.grant
      parameters:
        - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: 调用结果和独立熔断状态 }
        '403': { description: 未授权权限或未声明出网域名 }
  /api/v1/plugins/installations/{installationId}/actions/upgrade:
    post:
      operationId: upgradeOfficialPlugin
      summary: 升级官方插件；新增权限或域名必须重新授权
      security: [{ EmployeeBearer: [] }]
      x-required-permission: plugin.install
      parameters:
        - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: 已升级或经重新授权后升级 }
  /api/v1/plugins/installations/{installationId}/actions/uninstall:
    post:
      operationId: uninstallOfficialPlugin
      summary: 撤销令牌、停止新任务并按清单删除插件数据
      security: [{ EmployeeBearer: [] }]
      x-required-permission: plugin.install
      parameters:
        - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 卸载完成并保存删除回执 }
  /api/v1/reports/monthly-value:
    get:
      operationId: getMonthlyValueReport
      summary: 查询每个数字都带统计口径和来源事件的月度价值报告
      security: [{ EmployeeBearer: [] }]
      x-required-permission: report.value.read
      parameters:
        - {
            name: month,
            in: query,
            required: true,
            schema: { type: string, pattern: '^\d{4}-\d{2}$' },
          }
        - { name: storeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 指标、统计版本、更新时间、来源事件和 GEO 非承诺说明 }
        '409': { description: 报告尚未生成完成 }
  /api/v1/internal/reports/monthly-value/actions/materialize:
    post:
      operationId: materializeMonthlyValueReport
      summary: 内部作业按租户和月份固化可追溯价值报告
      security: [{ InternalWorkerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, month]
              properties:
                tenantId: { type: string, format: uuid }
                month: { type: string, pattern: '^\d{4}-\d{2}$' }
                storeId: { type: string, format: uuid }
      responses:
        '201': { description: 报告快照已固化或返回已存在的同月快照 }
        '401': { description: 内部 Worker 凭证无效 }
  /api/v1/internal/geo/targets/{targetId}/actions/check:
    post:
      operationId: checkGeoTarget
      summary: 内部作业检查渠道授权、可访问性和强一致字段差异
      security: [{ InternalWorkerBearer: [] }]
      parameters:
        - { name: targetId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId: { type: string, format: uuid }
      responses:
        '200': { description: 目标健康状态和差异字段清单 }
        '401': { description: 内部 Worker 凭证无效 }
components:
  securitySchemes:
    EmployeeBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 签名会话，必须包含固定 issuer/audience、tenant_id、user_id、role_codes、store_ids、session_id、auth_level、iat 和 exp。
    ConsumerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 独立 audience 的消费者短时会话，服务端绑定 tenant_id、customer_id、store_id、session_id 与身份校验等级，并实时检查撤销和到期。
    LifeConsumerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 乐趣生活平台消费者短时会话，仅绑定平台 account_id 与 session_id；跨商户访问必须再验证账号到商户客户档案的当前绑定。
    LifeConsumerSecondaryBearer:
      type: apiKey
      in: header
      name: X-Life-Authorization
      description: 独立商家小程序双身份接口使用的乐趣生活平台 Bearer 令牌；与 Authorization 中的商家消费者令牌同时校验。
    InternalWorkerBearer:
      type: http
      scheme: bearer
      description: 仅租户分片后台 Worker 使用的独立高熵服务凭证，不接受员工或消费者令牌。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    StatementId:
      name: statementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IntakeSessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IntakeUploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryStepCode:
      name: stepCode
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 120 }
    MiniProgramId:
      name: miniProgramId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MiniProgramReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: 请求或租户上下文无效
  schemas:
    CommerceProvider:
      type: string
      enum: [WECHAT_PAY, ALIPAY, SANDBOX]
    CreateCommerceOrderRequest:
      type: object
      additionalProperties: false
      required: [storeId, sourceChannel, orderType, items]
      properties:
        storeId: { type: string, format: uuid }
        sourceChannel: { type: string, enum: [MERCHANT_MINI_PROGRAM, LEQU_LIFE] }
        orderType:
          { type: string, enum: [PHYSICAL_DELIVERY, STORE_PICKUP, GROUP_BUY, SERVICE_APPOINTMENT] }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [variantId, quantity]
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 999 }
    CommerceOrder:
      type: object
      required:
        [
          id,
          orderNo,
          storeId,
          customerId,
          orderType,
          status,
          paymentStatus,
          fulfillmentStatus,
          goodsAmountCents,
          discountAmountCents,
          shippingAmountCents,
          payableAmountCents,
          paidAmountCents,
          refundedAmountCents,
          currency,
          items,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        orderNo: { type: string }
        storeId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        sourceChannel: { type: string }
        orderType: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        fulfillmentStatus: { type: string }
        verificationStatus: { type: string }
        aftercareStatus: { type: string }
        goodsAmountCents: { type: integer, minimum: 0 }
        discountAmountCents: { type: integer, minimum: 0 }
        shippingAmountCents: { type: integer, minimum: 0 }
        payableAmountCents: { type: integer, minimum: 0 }
        paidAmountCents: { type: integer, minimum: 0 }
        refundedAmountCents: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        expiresAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        items:
          type: array
          items:
            type: object
            required:
              [
                id,
                productId,
                variantId,
                title,
                quantity,
                unitPriceCents,
                lineAmountCents,
                refundedQuantity,
              ]
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              title: { type: string }
              quantity: { type: integer, minimum: 1 }
              unitPriceCents: { type: integer, minimum: 0 }
              lineAmountCents: { type: integer, minimum: 0 }
              refundedQuantity: { type: integer, minimum: 0 }
    CreateCommercePaymentRequest:
      type: object
      additionalProperties: false
      required: [orderId, provider]
      properties:
        orderId: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/CommerceProvider' }
    CommercePaymentIntent:
      type: object
      required:
