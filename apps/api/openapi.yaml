        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmMiniProgramPreviewRequest' }
      responses:
        '200':
          description: 与配置摘要和构建摘要严格绑定的不可变确认已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiniProgram' }
        '422': { description: 不是指定确认人、清单不完整或体验版未就绪 }
  /api/v1/mini-programs/{miniProgramId}/releases/{releaseId}/actions/submit-review:
    post:
      operationId: submitMerchantMiniProgramReview
      summary: 仅提交已完成精确体验版确认的版本
      security: [{ EmployeeBearer: [] }]
      x-required-permission: miniprogram.release.submit
      parameters:
        - $ref: '#/components/parameters/MiniProgramId'
        - $ref: '#/components/parameters/MiniProgramReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 微信审核单号与提交凭据已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiniProgram' }
        '422': { description: 精确构建确认或有效授权缺失 }
        '503': { description: 微信审核提交结果未知 }
  /api/v1/mini-programs/{miniProgramId}/releases/{releaseId}/actions/publish:
    post:
      operationId: publishMerchantMiniProgramRelease
      summary: 仅发布微信审核通过版本，并主动查询超时结果
      security: [{ EmployeeBearer: [] }]
      x-required-permission: miniprogram.release.publish
      parameters:
        - $ref: '#/components/parameters/MiniProgramId'
        - $ref: '#/components/parameters/MiniProgramReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 发布成功或经线上查询收敛成功，并启动分批观测
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiniProgram' }
        '409': { description: 版本未审核通过或命令仍待恢复 }
        '503': { description: 发布结果无法安全确认，禁止盲目重发 }
  /api/v1/mini-programs/{miniProgramId}/actions/rollback:
    post:
      operationId: rollbackMerchantMiniProgram
      summary: 复制上一稳定构建创建全新回滚版本，保留全部历史
      security: [{ EmployeeBearer: [] }]
      x-required-permission: miniprogram.release.rollback
      parameters:
        - $ref: '#/components/parameters/MiniProgramId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RollbackMiniProgramRequest' }
      responses:
        '202':
          description: 新回滚版本成为当前稳定版本；故障版本只标记不删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiniProgram' }
        '409': { description: 无上一稳定版本或当前状态不可回滚 }
        '503': { description: 微信回滚网关结果未知 }
  /api/v1/mini-programs/{miniProgramId}/releases/{releaseId}/rollout-health:
    post:
      operationId: recordMerchantMiniProgramRolloutHealth
      summary: 记录当前发布波次健康指标并决定扩大或停止
      security: [{ EmployeeBearer: [] }]
      x-required-permission: miniprogram.release.publish
      parameters:
        - $ref: '#/components/parameters/MiniProgramId'
        - $ref: '#/components/parameters/MiniProgramReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MiniProgramRolloutHealthRequest' }
      responses:
        '200':
          description: 当前波次已通过并创建下一波，或已停止扩大
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiniProgram' }
        '409': { description: 波次不存在、已完成或发布版本不匹配 }
  /api/v1/webhooks/wechat/mini-program:
    post:
      operationId: receiveMerchantMiniProgramCallback
      summary: 微信小程序授权和审核安全模式回调
      description: 先校验 SHA-1 签名和五分钟时间窗，再持久化加密原文；由可信网关解码后按事件 ID 与密文摘要精确去重。
      security: []
      parameters:
        - { name: msg_signature, in: query, required: true, schema: { type: string } }
        - { name: timestamp, in: query, required: true, schema: { type: string } }
        - { name: nonce, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/xml:
            schema: { type: string }
      responses:
        '200': { description: 返回 success，事件已安全收敛或为完全相同的重放 }
        '400': { description: 参数或 XML 无效 }
        '401': { description: 签名或时间窗无效 }
        '409': { description: 相同事件 ID 对应不同密文 }
        '503': { description: 原文存储或可信解码器不可用，要求微信重试 }
  /api/v1/revenue-operations/subscription:
