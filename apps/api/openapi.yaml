        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent, payload, approvalConfirmed]
              properties:
                intent: { type: string, minLength: 3, maxLength: 300 }
                payload: { type: object, additionalProperties: true }
                approvalConfirmed: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/SkillNetworkOverview' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchant/overview:
    get:
      operationId: getMerchantOperationsOverview
      summary: 获取经营宝今日指标、AI 建议、履约队列与可钻取经营分析
      parameters:
        - name: focusOrderId
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/MerchantOperationsOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /merchant/orders/{orderId}/confirm:
    post:
      operationId: confirmMerchantOrder
      summary: 确认待接预约并锁定履约时段
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionMutation' }
      responses:
        '200': { $ref: '#/components/responses/MerchantOperationsOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchant/orders/{orderId}/verify:
    post:
      operationId: verifyMerchantOrder
      summary: 强确认核销码、金额与履约状态并保存不可篡改证据
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [verificationCode, confirmed]
                  properties:
                    verificationCode: { type: string, pattern: '^\d{6}$' }
                    confirmed: { type: boolean, const: true }
      responses:
        '200': { $ref: '#/components/responses/MerchantOperationsOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchant/orders/{orderId}/approve-refund:
    post:
      operationId: approveMerchantRefund
      summary: 由有退款权限的角色强确认金额、原因和资金影响
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [refundAmountFen, reason, confirmed]
                  properties:
                    refundAmountFen: { type: integer, minimum: 1 }
                    reason: { type: string, minLength: 3, maxLength: 300 }
                    confirmed: { type: boolean, const: true }
      responses:
        '200': { $ref: '#/components/responses/MerchantOperationsOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchant/catalog/overview:
    get:
      operationId: getMerchantCatalogOverview
      summary: 获取门店商品目录、SPU/SKU、库存预警、预约时段和导入记录
      parameters:
        - name: focusSpuId
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/MerchantCatalogOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /merchant/catalog/spus:
    post:
      operationId: createMerchantCatalogSpu
      summary: 创建商品、服务或套餐草稿及首个 SKU
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, category, description, mediaCompletion, sku]
              properties:
                type: { type: string, enum: [PRODUCT, SERVICE, PACKAGE] }
                name: { type: string, minLength: 2, maxLength: 120 }
                category: { type: string, minLength: 2, maxLength: 80 }
                description: { type: string, minLength: 5, maxLength: 1000 }
                mediaCompletion: { type: integer, minimum: 0, maximum: 100 }
                sku:
                  type: object
                  required: [code, name, priceFen, stockMode, stockQuantity, lowStockThreshold]
                  properties:
                    code: { type: string, pattern: '^[A-Z0-9-]+$' }
                    name: { type: string, minLength: 2, maxLength: 120 }
                    priceFen: { type: integer, minimum: 1 }
                    stockMode: { type: string, enum: [FINITE, UNLIMITED, SLOT] }
                    stockQuantity: { type: integer, minimum: 0 }
                    lowStockThreshold: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/MerchantCatalogOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchant/catalog/spus/{spuId}/publish:
    post:
      operationId: publishMerchantCatalogSpu
      summary: 校验图文完整度、SKU 和预约时段后发布商品
      parameters:
        - $ref: '#/components/parameters/SpuId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionMutation' }
      responses:
        '200': { $ref: '#/components/responses/MerchantCatalogOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchant/catalog/skus/{skuId}/price:
    post:
      operationId: changeMerchantCatalogSkuPrice
      summary: 强确认 SKU 改价并创建独立价格规则版本
      parameters:
        - $ref: '#/components/parameters/SkuId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [priceFen, compareAtFen, reason, confirmed]
                  properties:
                    priceFen: { type: integer, minimum: 1 }
                    compareAtFen: { type: [integer, 'null'], minimum: 0 }
                    reason: { type: string, minLength: 3, maxLength: 300 }
                    confirmed: { type: boolean, const: true }
      responses:
        '200': { $ref: '#/components/responses/MerchantCatalogOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchant/catalog/skus/{skuId}/stock:
    post:
      operationId: adjustMerchantCatalogSkuStock
      summary: 按差量盘点有限库存并自动处理低库存与售罄状态
      parameters:
        - $ref: '#/components/parameters/SkuId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [delta, reason]
                  properties:
                    delta: { type: integer, minimum: -100000, maximum: 100000, not: { const: 0 } }
                    reason: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200': { $ref: '#/components/responses/MerchantCatalogOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchant/catalog/slots/{slotId}/capacity:
    post:
      operationId: updateMerchantCatalogServiceSlot
      summary: 强确认预约容量和时段加价且保护既有预约
      parameters:
        - $ref: '#/components/parameters/SlotId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionMutation'
                - type: object
                  required: [capacity, priceOverrideFen, confirmed]
                  properties:
                    capacity: { type: integer, minimum: 1, maximum: 10000 }
                    priceOverrideFen: { type: [integer, 'null'], minimum: 0 }
                    confirmed: { type: boolean, const: true }
      responses:
        '200': { $ref: '#/components/responses/MerchantCatalogOverview' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchant/catalog/imports/preview:
    post:
      operationId: previewMerchantCatalogImport
