openapi: 3.1.0
info:
  title: 乐趣宝与乐趣生活 API
  version: 6.1.0
  description: V6.1 重建分支的已实现接口；未实现的总包目标接口不在此文件中伪装为可用。
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: 进程健康
  /ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: 依赖就绪
        '503':
          description: 依赖不可用
  /api/v1/context:
    get:
      operationId: inspectTenantContext
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 当前租户上下文
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/merchants/{merchantProfileId}/revenue-rights:
    post:
      operationId: createMerchantRevenueRight
      summary: 为已签约商户激活唯一的原始商务永久收益权
      x-required-permission: revenue_right.create
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: merchantProfileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRevenueRightRequest'
      responses:
        '201':
          description: 收益权已生效；重复的同请求返回相同资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueRight'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 幂等键冲突或商户已有有效原始收益权
        '422':
          description: 受益人不是有效商务人员
components:
  parameters:
    TenantId:
      name: x-tenant-id
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
  responses:
    BadRequest:
      description: 请求或租户上下文无效
  schemas:
    RevenueRightHolder:
      type: object
      additionalProperties: false
      required: [beneficiaryId, shareBps]
      properties:
        beneficiaryId: { type: string, format: uuid }
        shareBps: { type: integer, minimum: 1, maximum: 7000 }
    CreateRevenueRightRequest:
      type: object
      additionalProperties: false
      required: [sourceContractRef, startsAt, createdBy, holders]
      properties:
        sourceContractRef: { type: string, minLength: 1, maxLength: 255 }
        startsAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        evidence: { type: object, additionalProperties: true, default: {} }
        holders:
          type: array
          minItems: 1
          description: 受益人不可重复，shareBps 合计必须恰好为 7000。
          items:
            $ref: '#/components/schemas/RevenueRightHolder'
    RevenueRight:
      type: object
      additionalProperties: false
      required: [id, merchantProfileId, status, startsAt, holders]
      properties:
        id: { type: string, format: uuid }
        merchantProfileId: { type: string, format: uuid }
        status: { type: string, const: ACTIVE }
        startsAt: { type: string, format: date-time }
        holders:
          type: array
          items:
            $ref: '#/components/schemas/RevenueRightHolder'
