openapi: 3.1.0
info:
  title: 乐趣宝与乐趣生活 API
  version: 6.1.0
  description: V6.1 重建分支的已实现接口；未实现的总包目标接口不在此文件中伪装为可用。
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: 进程健康
  /ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: 依赖就绪
        '503':
          description: 依赖不可用
  /internal/v1/metrics:
    get:
      operationId: getOperationalMetrics
      summary: 内部监控采集低基数 HTTP 请求、失败和延迟指标
      security: [{ InternalWorkerBearer: [] }]
      responses:
        '200': { description: Prometheus 文本格式指标，不含租户、顾客或业务正文标签 }
        '401': { description: 内部监控凭证无效 }
  /api/v1/auth/sessions/refresh:
    post:
      operationId: refreshEmployeeSession
      summary: 校验设备绑定的刷新凭证并轮换新凭证
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshSessionRequest' }
      responses:
        '200':
          description: 刷新凭证已轮换，旧凭证立即失效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 会话、设备或刷新凭证无效 }
  /api/v1/auth/sessions/switch-tenant:
    post:
      operationId: switchEmployeeTenant
      summary: 依据服务端实时成员关系切换当前组织
      security: [{ EmployeeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchTenantRequest' }
      responses:
        '200':
          description: 目标组织的新会话已签发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 当前会话或目标组织成员身份无效 }
  /api/v1/auth/sessions/revoke:
    post:
      operationId: revokeEmployeeSession
      summary: 注销当前会话并废止刷新凭证
      security: [{ EmployeeBearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 255, default: USER_LOGOUT }
      responses:
        '204': { description: 会话已废止 }
        '401': { description: 当前会话无效 }
  /api/v1/context:
    get:
      operationId: inspectTenantContext
      security: [{ EmployeeBearer: [] }]
      responses:
        '200':
          description: 由签名且未撤销的服务端会话确定的当前上下文
        '401': { description: 会话缺失、过期、撤销或账号已停用 }
  /api/v1/operational-home/today:
    get:
      operationId: getOperationalHomeToday
      summary: 按当前员工服务端门店范围汇总今日经营和待办
      security: [{ EmployeeBearer: [] }]
      responses:
        '200':
          description: 租户时区内的今日指标及可追溯待办入口，不包含客户明文或对象地址
          content:
            application/json:
              schema:
                type: object
                required: [timezone, period, storeScope, metrics, todos]
                properties:
                  timezone: { type: string }
                  period:
                    type: object
                    required: [start, end]
                    properties:
                      start: { type: string, format: date-time }
                      end: { type: string, format: date-time }
                  storeScope: { type: string, enum: [TENANT, ASSIGNED] }
                  metrics:
                    type: object
                    required:
                      [
                        ordersCreated,
                        paidAmountCents,
                        fulfillment,
                        refunds,
                        customerHandoffs,
                        deliveryExceptions,
                        agentAttention,
                        notifications,
                      ]
                    additionalProperties: { type: integer, minimum: 0 }
                  todos:
                    type: array
                    items:
                      type: object
                      required: [kind, label, count, priority, route]
                      properties:
                        kind: { type: string }
                        label: { type: string }
                        count: { type: integer, minimum: 1 }
                        priority: { type: string, enum: [URGENT, HIGH, NORMAL] }
                        route: { type: string, pattern: '^/bao/page-[0-9]{3}' }
        '401': { description: 当前员工会话无效 }
        '403': { description: 当前员工没有可用租户或门店范围 }
  /api/v1/geo-operations/overview:
    get:
      operationId: getGeoOperationsOverview
      summary: 查询员工授权门店的 GEO 档案、渠道发布及健康状态
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: query, name: storeId, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 脱敏 GEO 健康汇总；不返回渠道外部记录号、原始响应或字段哈希 }
        '401': { description: 员工会话无效 }
        '403': { description: 缺少 geo.read 权限 }
  /api/v1/geo-operations/differences:
    get:
      operationId: listGeoOperationsDifferences
      summary: 查询员工授权门店的一致性差异
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: query, name: storeId, schema: { type: string, format: uuid } }
        - {
            in: query,
            name: status,
            schema: { type: string, enum: [OPEN, CONFIRMED, RESOLVED, IGNORED] },
          }
      responses:
        '200': { description: 差异字段和处理状态；不返回标准值或观测值哈希 }
        '401': { description: 员工会话无效 }
        '403': { description: 缺少 geo.read 权限 }
  /api/v1/geo-operations/differences/{differenceId}/actions/decide:
    post:
      operationId: decideGeoOperationsDifference
      summary: MFA 下确认修正或忽略授权门店的一致性差异
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: path, name: differenceId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reasonCode]
              properties:
                decision: { type: string, enum: [RESOLVE, IGNORE] }
                reasonCode: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200': { description: 差异状态已原子更新并记录真实操作者审计 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 员工会话或 MFA 无效 }
        '403': { description: 缺少 geo.publish 权限 }
        '404': { description: 差异不存在或不在当前门店范围 }
        '409': { description: 差异已经结束，不能重复决定 }
  /api/v1/customer-service-operations/shifts:
    get:
      operationId: listCustomerServiceShifts
      summary: 查询当前员工授权门店的客服值班
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: query, name: storeId, schema: { type: string, format: uuid } }
        - {
            in: query,
            name: status,
            schema: { type: string, enum: [SCHEDULED, ACTIVE, ENDED, CANCELLED] },
          }
      responses:
        '200': { description: 授权门店内的客服值班列表 }
        '403': { description: 缺少 customer_service.read 权限 }
    post:
      operationId: createCustomerServiceShift
      summary: MFA 下为授权门店安排不超过 24 小时且不冲突的客服值班
      security: [{ EmployeeBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, assigneeUserId, startsAt, endsAt]
              properties:
                storeId: { type: string, format: uuid }
                assigneeUserId: { type: string, format: uuid }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
      responses:
        '201': { description: 值班已创建并记录审计 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 员工会话或 MFA 无效 }
        '403': { description: 缺少 merchant_profile.manage 权限或员工不属于门店 }
        '409': { description: 幂等冲突或值班时间冲突 }
  /api/v1/customer-service-operations/tasks:
    get:
      operationId: listCustomerServiceTasks
      summary: 查询当前员工授权门店的客户服务任务
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: query, name: storeId, schema: { type: string, format: uuid } }
        - {
            in: query,
            name: status,
            schema: { type: string, enum: [OPEN, IN_PROGRESS, DONE, CANCELLED] },
          }
      responses:
        '200': { description: 仅含资源标识和脱敏摘要的客户服务任务 }
        '403': { description: 缺少 customer_service.read 权限 }
    post:
      operationId: createCustomerServiceTask
      summary: 为属于授权门店的客户或会话创建可追踪服务任务
      security: [{ EmployeeBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, taskType, priority, dueAt, summaryRedacted]
              anyOf:
                - required: [customerId]
                - required: [conversationId]
              properties:
                storeId: { type: string, format: uuid }
                customerId: { type: string, format: uuid }
                conversationId: { type: string, format: uuid }
                taskType:
                  type: string
                  enum: [FOLLOW_UP, RETENTION, COMPLAINT, KNOWLEDGE_GAP, SERVICE_RECOVERY]
                priority: { type: string, enum: [NORMAL, HIGH, URGENT] }
                assignedUserId: { type: string, format: uuid }
                dueAt: { type: string, format: date-time }
                summaryRedacted: { type: object, additionalProperties: true }
      responses:
        '201': { description: 客户服务任务已创建并记录审计 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: 缺少 customer_service.send 权限 }
        '404': { description: 客户、会话或负责人不属于授权门店 }
        '409': { description: 幂等键与原请求冲突 }
  /api/v1/customer-service-operations/tasks/{taskId}/actions/complete:
    post:
      operationId: completeCustomerServiceTask
      summary: 以当前版本原子完成授权门店客户服务任务
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, resolutionCode]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                resolutionCode: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200': { description: 任务已完成或返回完全相同的幂等结果 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: 缺少 customer_service.close 权限 }
        '404': { description: 任务不存在或不在授权门店范围 }
        '409': { description: 幂等、版本或任务状态冲突 }
  /api/v1/customer-service-operations/quality-reviews:
    get:
      operationId: listCustomerServiceQualityReviews
      summary: 查询按低评分、投诉、高风险及抽样触发的客服质检
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: query, name: storeId, schema: { type: string, format: uuid } }
        - {
            in: query,
            name: status,
            schema: { type: string, enum: [PENDING, REVIEWED, REMEDIATION_REQUIRED, CLOSED] },
          }
      responses:
        '200': { description: 授权门店内的脱敏质检列表及评分状态 }
        '403': { description: 缺少 customer_service.read 权限 }
  /api/v1/customer-service-operations/quality-reviews/{reviewId}/actions/decide:
    post:
      operationId: decideCustomerServiceQualityReview
      summary: MFA 下提交质检结论，并在需要整改时原子创建知识补齐任务
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: path, name: reviewId, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  expectedVersion,
                  decision,
                  accuracyScore,
                  safetyScore,
                  policyScore,
                  findingsRedacted,
                ]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                decision: { type: string, enum: [REVIEWED, REMEDIATION_REQUIRED] }
                accuracyScore: { type: integer, minimum: 0, maximum: 100 }
                safetyScore: { type: integer, minimum: 0, maximum: 100 }
                policyScore: { type: integer, minimum: 0, maximum: 100 }
                findingsRedacted: { type: object, additionalProperties: true }
                remediationDueAt: { type: string, format: date-time }
      responses:
        '200': { description: 质检已决定，必要时已创建关联整改任务并记录审计 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: 员工会话或 MFA 无效 }
        '403': { description: 缺少 customer_service.close 权限 }
        '404': { description: 质检不存在或不在授权门店范围 }
        '409': { description: 幂等、版本或质检状态冲突 }
  /api/v1/integrations/wecom/connection-health:
    get:
      operationId: listWeComConnectionHealth
      summary: 查询企业微信接入和内部通知连接的持久健康证据
      security: [{ EmployeeBearer: [] }]
      responses:
        '200': { description: 仅含状态、时间和错误代码，不返回连接密钥 }
        '403': { description: 缺少 audit.read 权限 }
  /api/v1/integrations/wecom/connection-health/actions/retry:
    post:
      operationId: retryWeComConnectionHealth
      summary: MFA 下为指定连接创建一次可追踪健康检查任务
      security: [{ EmployeeBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connectorCode, expectedVersion]
              properties:
                connectorCode: { type: string, enum: [WECOM_INTAKE, WECOM_NOTIFICATION] }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: 检查任务已持久化并进入异步队列 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 幂等、版本或连接状态冲突 }
  /api/v1/reward-rules:
    get:
      operationId: listRewardRules
      summary: 查询租户版本化奖励规则及出资、发放和冲正规则
      security: [{ EmployeeBearer: [] }]
      responses:
        '200': { description: 当前及历史奖励规则版本 }
        '403': { description: 缺少 reward_rule.manage 权限 }
  /api/v1/reward-rules/actions/publish:
    post:
      operationId: publishRewardRule
      summary: MFA 下发布新的活动奖励规则版本并退役旧版本
      security: [{ EmployeeBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  ruleCode,
                  expectedCurrentVersion,
                  fundingSource,
                  triggerCode,
                  grantConfig,
                  reversalPolicy,
                ]
              properties:
                ruleCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,79}$' }
                expectedCurrentVersion: { type: integer, minimum: 0 }
                fundingSource:
                  { type: string, enum: [MERCHANT, PLATFORM_CAMPAIGN, PARTNER_CAMPAIGN] }
                triggerCode: { type: string }
                grantConfig:
                  type: object
                  additionalProperties: false
                  required: [amountCents, availableAfterHours, expiresAfterDays]
                  properties:
                    amountCents: { type: integer, minimum: 1 }
                    availableAfterHours: { type: integer, minimum: 0, maximum: 720 }
                    expiresAfterDays: { type: integer, minimum: 1, maximum: 3650 }
                reversalPolicy:
                  type: object
                  additionalProperties: false
                  required: [fullRefund, partialRefund]
                  properties:
                    fullRefund: { type: string, const: FULL_REVERSAL }
                    partialRefund: { type: string, const: PROPORTIONAL_REVERSAL }
      responses:
        '200': { description: 新规则版本已生效，旧版本仅保留历史 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 幂等或当前规则版本冲突 }
  /api/v1/skills/catalog:
    get:
      operationId: listOfficialSkills
      summary: 查询官方版本化、完整性校验且不能扩大调用者权限的首发技能目录
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 120 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: 技能版本、输入步骤、确认点、成功标准和执行上限 }
        '403': { description: 缺少 plugin.install 权限 }
  /api/v1/platform/merchants:
    get:
      operationId: listPlatformMerchants
      summary: 平台授权角色查询不含主体证件和联系人明文的商户目录
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: 商户状态、行业、门店数量及当前套餐摘要 }
        '404': { description: 当前身份不是平台授权角色 }
  /api/v1/platform/plans:
    get:
      operationId: listPlatformPlans
      summary: 查询总部套餐权益配置及当前版本
      security: [{ EmployeeBearer: [] }]
      responses:
        '200': { description: 套餐、价格、权益和版本 }
        '403': { description: 缺少 revenue_policy.manage 权限 }
  /api/v1/platform/plans/{planCode}/actions/update-entitlements:
    post:
      operationId: updatePlatformPlanEntitlements
      summary: MFA 下按版本更新新订阅使用的套餐权益配置
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: path, name: planCode, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, entitlements]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                entitlements: { type: object, additionalProperties: true }
      responses:
        '200': { description: 权益配置已更新并生成审计；订阅快照仍保留原版本 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 幂等、版本或密钥形配置冲突 }
  /api/v1/finance/reconciliation-discrepancies:
    get:
      operationId: listReconciliationDiscrepancies
      summary: 查询当前租户不可变对账事实产生的差异单
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: 差异原因、金额、处理状态和版本，不含渠道凭证 }
        '403': { description: 缺少 finance.reconcile 权限 }
  /api/v1/finance/reconciliation-discrepancies/{discrepancyId}/actions/resolve:
    post:
      operationId: resolveReconciliationDiscrepancy
      summary: MFA 下结束差异单而不修改不可变支付、退款或账本事实
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: path, name: discrepancyId, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, decision, resolutionCode]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                decision: { type: string, enum: [RESOLVED, ACCEPTED_KNOWN] }
                resolutionCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,119}$' }
      responses:
        '200': { description: 差异单已结束；全部差异结束时批次转为已解决 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 幂等、版本或状态冲突 }
  /api/v1/platform/channel-partners:
    get:
      operationId: listPlatformChannelPartners
      summary: 查询平台渠道伙伴及明确的省市区授权范围
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: 伙伴、负责人标识、状态和区域版本 }
        '404': { description: 当前身份不是平台授权角色 }
  /api/v1/platform/channel-partners/actions/save:
    post:
      operationId: savePlatformChannelPartner
      summary: MFA 下创建或按版本更新渠道伙伴并分配明确区域
      security: [{ EmployeeBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [partnerCode, partnerName, partnerType, ownerUserId, status, region]
              properties:
                partnerId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 1 }
                partnerCode: { type: string, pattern: '^[A-Z][A-Z0-9_-]{1,79}$' }
                partnerName: { type: string, minLength: 1, maxLength: 160 }
                partnerType:
                  { type: string, enum: [CHANNEL_PARTNER, INVESTMENT_OPERATOR, REGIONAL_PROVIDER] }
                ownerUserId: { type: string, format: uuid }
                status: { type: string, enum: [ACTIVE, SUSPENDED] }
                region:
                  type: object
                  additionalProperties: false
                  required: [provinceCode]
                  properties:
                    provinceCode: { type: string, minLength: 1, maxLength: 20 }
                    cityCode: { type: string, minLength: 1, maxLength: 20 }
                    districtCode: { type: string, minLength: 1, maxLength: 20 }
      responses:
        '200': { description: 伙伴和区域已保存并审计 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 幂等、负责人、版本或区域冲突 }
  /api/v1/platform/model-route-budgets:
    get:
      operationId: listPlatformModelRouteBudgets
      summary: 查询不含提供方密钥的模型路由、单任务和月度预算
      security: [{ EmployeeBearer: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: 模型标识、用途、预算、步骤和工具调用上限 }
        '404': { description: 当前身份不是平台授权角色 }
  /api/v1/platform/model-route-budgets/actions/save:
    post:
      operationId: savePlatformModelRouteBudget
      summary: MFA 下按版本保存模型路由预算，强制十二步和二十次工具调用上限
      security: [{ EmployeeBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  routeCode,
                  expectedVersion,
                  purpose,
                  modelKey,
                  perTaskBudgetCents,
                  monthlyBudgetCents,
                  maxSteps,
                  maxToolCalls,
                  status,
                ]
              properties:
                routeCode: { type: string, pattern: '^[A-Z][A-Z0-9_.-]{1,79}$' }
                expectedVersion: { type: integer, minimum: 0 }
                purpose: { type: string, minLength: 1, maxLength: 240 }
                modelKey: { type: string, minLength: 2, maxLength: 160 }
                perTaskBudgetCents: { type: integer, minimum: 0 }
                monthlyBudgetCents: { type: integer, minimum: 0 }
                maxSteps: { type: integer, minimum: 1, maximum: 12 }
                maxToolCalls: { type: integer, minimum: 0, maximum: 20 }
                status: { type: string, enum: [ACTIVE, SUSPENDED] }
      responses:
        '200': { description: 模型路由预算已保存并审计 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 幂等、版本或预算上限冲突 }
